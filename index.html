/* ---------------------------------------------------------------------------
 * 页面 2 · 旋转木马（右下角）
 * —— 平时微微转动；点一下快速转一圈，连点几下就连续转几圈（排队依次转完）
 * -------------------------------------------------------------------------*/
const Carousel = (function(){
  const wrap  = document.getElementById('carousel');
  const ring  = document.getElementById('csRing');
  if(!wrap || !ring) return { start:function(){}, stop:function(){} };

  const horses = $$('.cs-horse', ring);
  const N = horses.length || 1;

  let CX = 0, CY = 0, RX = 0, RY = 0;
  let base = 0;          // 缓慢自转累计角度
  let finished = 0;      // 已转完的快速圈 × 360
  let queue = 0;         // 还欠几圈
  let cur = null;        // 当前正在转的那一圈
  let raf = 0, lastT = 0, active = false;

  const TURN_MS = 900;   // 一圈用时

  function measure(){
    const w = ring.clientWidth || 100, h = ring.clientHeight || 60;
    CX = w / 2; CY = h / 2;
    RX = w * 0.40; RY = h * 0.30;
  }

  function paint(total, t){
    for(let i = 0; i < N; i++){
      const el = horses[i];
      const phi = ((total + i * (360 / N)) % 360) * Math.PI / 180;
      const s = Math.sin(phi), c = Math.cos(phi);
      const bob = Math.sin(t / 520 + i * 1.7) * 1.8;          // 马儿上下轻轻起伏
      const sc  = 0.70 + 0.30 * ((s + 1) / 2);                // 前排大、后排小
      el.style.transform =
        'translate(-50%,-50%) translate(' + (CX + c * RX).toFixed(2) + 'px,' +
        (CY + s * RY + bob).toFixed(2) + 'px) scale(' + sc.toFixed(3) + ')';
      el.style.opacity = (0.55 + 0.45 * ((s + 1) / 2)).toFixed(3);
      el.style.zIndex  = String(10 + Math.round(s * 8));
    }
  }

  function frame(t){
    if(!lastT) lastT = t;
    const dt = Math.min(48, t - lastT); lastT = t;
    base += dt * 0.010;                 // 约每秒 10°，非常缓慢

    let extra = 0;
    if(cur){
      let p = (t - cur.start) / TURN_MS;
      if(p >= 1){
        extra += 360; finished += 360; queue--;
        cur = queue > 0 ? { start: t } : null;
      }else{
        extra += 360 * (1 - Math.pow(1 - p, 3));   // 先快后慢地收尾
      }
    }
    paint(base + finished + extra, t);
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if(active) return;
    active = true; measure(); lastT = 0;
    raf = requestAnimationFrame(frame);
  }
  function stop(){
    active = false;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
  }

  function spinOnce(){
    AudioManager.unlock();
    queue++;
    if(!cur) cur = { start: (window.performance && performance.now) ? performance.now() : Date.now() };
    wrap.classList.remove('cs-boost');
    void wrap.offsetWidth;
    wrap.classList.add('cs-boost');
  }

  on(wrap, 'click', spinOnce);
  on(wrap, 'keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); spinOnce(); }
  });

  window.addEventListener('resize', function(){ if(active) measure(); }, { passive:true });
  window.addEventListener('orientationchange', function(){ setTimeout(measure, 300); });

  return { start: start, stop: stop, spin: spinOnce };
})();


/* ---------------------------------------------------------------------------
 * 页面 2 · 卡通草莓蛋糕（左下角）
 * —— 点一下吃一口（吃掉一颗草莓），点三下吃完；吃完后先隐约浮现，再慢慢长回来
 * -------------------------------------------------------------------------*/
(function initStrawberryCake(){
  const el = document.getElementById('sbCake');
  if(!el) return;

  // ===== 【想改吃掉时冒出来的小字，改这里】 =====
  const POPS = ['好好吃！', '再来一口～', '吃光光啦'];

  let bites = 0, busy = false;

  function floatText(txt){
    const s = document.createElement('span');
    s.className = 'sb-float';
    s.textContent = txt;
    el.appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1250);
  }

  function take(){
    if(busy || bites >= 3) return;
    bites++;
    el.classList.add('bitten-' + bites);
    floatText(POPS[bites - 1]);

    if(bites >= 3){
      busy = true;
      // 吃完：先整块淡出，再以很淡的样子呼吸一会儿，最后缓缓长回来
      setTimeout(function(){
        el.classList.add('gone');
        setTimeout(function(){
          el.classList.remove('gone', 'bitten-1', 'bitten-2', 'bitten-3');
          el.classList.add('regrow');
          bites = 0;
          setTimeout(function(){
            el.classList.remove('regrow');
            busy = false;
          }, 1650);
        }, 1500);
      }, 700);
    }
  }

  on(el, 'click', take);
  on(el, 'keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); take(); }
  });
})();


/* ---------------------------------------------------------------------------
 * 页面 3 · 烟花（Canvas 粒子系统，循环播放永不停止）
 * -------------------------------------------------------------------------*/
const Fireworks = (function(){
  const canvas = document.getElementById('fwCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let running = false, raf = 0, lastT = 0, nextLaunch = 0;
  let rockets = [], particles = [], flashes = [];
  let MAX_LIMIT = 1900;

  /* ===== 【想换烟花的配色，改这里】 =====
     五颜六色：玫红 / 珊瑚橙 / 金黄 / 薄荷绿 / 冰蓝 / 蓝紫 / 淡紫 / 银白 / 樱粉 / 青碧 */
  const PALETTE = [
    [255, 108, 140],   // 玫红
    [255, 158,  88],   // 珊瑚橙
    [255, 214,  96],   // 金黄
    [122, 232, 176],   // 薄荷绿
    [108, 198, 255],   // 冰蓝
    [146, 150, 255],   // 蓝紫
    [204, 138, 255],   // 淡紫
    [255, 255, 255],   // 银白
    [255, 176, 208],   // 樱粉
    [176, 255, 244],   // 青碧
    [255, 236, 168],   // 奶油金
    [168, 214, 255]    // 浅天蓝
  ];

  /* 从色环取色，用来做彩虹渐变烟花 */
  function hue2rgb(h){
    h = ((h % 360) + 360) % 360;
    const x = 1 - Math.abs(((h / 60) % 2) - 1);
    let r = 0, g = 0, b = 0;
    if(h < 60){ r = 1; g = x; }
    else if(h < 120){ r = x; g = 1; }
    else if(h < 180){ g = 1; b = x; }
    else if(h < 240){ g = x; b = 1; }
    else if(h < 300){ r = x; b = 1; }
    else { r = 1; b = x; }
    return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
  }

  /* 随机取 n 个配色 */
  function pickColors(n){
    const pool = PALETTE.slice(), out = [];
    while(out.length < n && pool.length){
      out.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
    }
    return out.length ? out : [PALETTE[7]];
  }

  /* 一整套配色方案：纯色 / 撞色 / 彩虹渐变 */
  function makeColors(){
    const m = Math.random();
    if(m < 0.34) return pickColors(1 + ((Math.random() * 2) | 0));          // 单色或双色
    if(m < 0.62){                                                            // 彩虹渐变
      const h0 = Math.random() * 360, out = [];
      for(let i = 0; i < 5; i++) out.push(hue2rgb(h0 + i * 24 + Math.random() * 12));
      return out;
    }
    return pickColors(3 + ((Math.random() * 2) | 0));                        // 3~4 色混搭
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    MAX_LIMIT = (W < 700) ? 1100 : 2600;
  }

  function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')'; }

  /* ---------- 粒子 ---------- */
  function Particle(x, y, vx, vy, color, o){
    this.x = x; this.y = y;
    this.px = x; this.py = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.size = (o.size || 2) + Math.random() * (o.sizeJit || 0);
    this.friction = o.friction == null ? 0.975 : o.friction;
    this.gravity = o.gravity == null ? 0.035 : o.gravity;
    this.decay = o.decay == null ? 0.011 : o.decay;
    this.alpha = 1;
    this.life = 0;
    this.spark = o.spark || 0;         // 拖尾小火花概率
    this.wobble = o.wobble || 0;       // 左右摇摆（柳树用）
    this.strobe = !!o.strobe;          // 频闪
    this.sphase = Math.random() * 6.28;
    this.split = o.split || 0;         // >0：飞行中二次炸开（十字裂）
    this.splitN = o.splitN || 7;
    this.glow = o.glow || 0;           // 额外柔光点
    this.trailMul = o.trailMul == null ? 1.5 : o.trailMul;
  }
  Particle.prototype.update = function(dt){
    this.px = this.x; this.py = this.y;
    const f = Math.pow(this.friction, dt);
    this.vx *= f;
    this.vy = this.vy * f + this.gravity * dt;
    if(this.wobble){
      this.vx += Math.sin(this.life * 0.06) * this.wobble * dt;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.alpha -= this.decay * dt;
    this.life += dt;
    if(this.alpha < 0) this.alpha = 0;
    // 二次炸开（十字裂）：倒计时归零的那一帧触发
    this.justSplit = false;
    if(this.split > 0){
      this.split -= dt;
      if(this.split <= 0) this.justSplit = true;
    }
  };
  Particle.prototype.draw = function(){
    let a = this.alpha;
    if(this.strobe) a *= (0.32 + 0.68 * Math.abs(Math.sin(this.life * 0.55 + this.sphase)));
    if(a <= 0.012) return;
    ctx.strokeStyle = rgba(this.color, a);
    ctx.lineWidth = this.size;
    ctx.beginPath();
    ctx.moveTo(this.px - this.vx * this.trailMul, this.py - this.vy * this.trailMul);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    if(this.glow){
      ctx.fillStyle = rgba(this.color, a * 0.55);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 1.7, 0, 6.2832);
      ctx.fill();
    }
  };

  /* ---------- 升空的礼花弹 ---------- */
  function Rocket(x){
    this.x = (x == null) ? W * (0.10 + Math.random() * 0.80) : x;
    this.target = H * (0.08 + Math.random() * 0.34);
    this.y = H + 8;
    this.vy = -(H * 0.0125 + Math.random() * 3.4);
    this.vx = (Math.random() - 0.5) * 1.1;
    this.colors = makeColors();
    this.color = this.colors[0];
    this.alpha = 1;
    this.trail = [];
  }
  Rocket.prototype.update = function(dt){
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    this.vy += 0.085 * dt;               // 减速
    this.trail.push([this.x, this.y]);
    if(this.trail.length > 9) this.trail.shift();
    return (this.vy >= -1.2) || (this.y <= this.target);
  };
  Rocket.prototype.draw = function(){
    for(let i = 0; i < this.trail.length; i++){
      const t = i / this.trail.length;
      ctx.strokeStyle = rgba(this.color, 0.10 + t * 0.5);
      ctx.lineWidth = 1 + t * 2.2;
      ctx.beginPath();
      if(i > 0){
        ctx.moveTo(this.trail[i - 1][0], this.trail[i - 1][1]);
        ctx.lineTo(this.trail[i][0], this.trail[i][1]);
      }
      ctx.stroke();
    }
    ctx.fillStyle = rgba([255,255,255], 0.95);
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.6, 0, 6.2832);
    ctx.fill();
  };

  /* ---------- 爆炸核心：按形态分配初速度 ---------- */
  function burst(x, y, cfg){
    const n = cfg.count;
    const cols = cfg.colors;
    for(let i = 0; i < n; i++){
      if(particles.length >= MAX_LIMIT) return;
      // 彩虹模式下按角度依次取色，形成渐变；否则随机取色，形成五彩混搭
      const col = cfg.rainbow
        ? cols[Math.min(cols.length - 1, (i * cols.length / n) | 0)]
        : cols[(Math.random() * cols.length) | 0];

      const t = i / n;
      const sp = cfg.speed * (0.42 + Math.random() * 0.86);
      let vx = 0, vy = 0;

      switch(cfg.type){
        case 'ring': {                                  // ④ 环形（带倾角的椭圆环）
          const a = t * Math.PI * 2;
          const s = cfg.speed * (0.96 + Math.random() * 0.08);
          vx = Math.cos(a) * s; vy = Math.sin(a) * s * (cfg.flatten || 0.5);
          break;
        }
        case 'willow': {                                // ③ 柳树垂落
          const a = t * Math.PI * 2;
          vx = Math.cos(a) * sp * 0.70; vy = Math.sin(a) * sp * 0.55 - 0.5;
          break;
        }
        case 'palm': {                                  // ⑥ 棕榈：向上散开的粗长尾
          const a = t * Math.PI * 2;
          vx = Math.cos(a) * sp * 1.15; vy = Math.sin(a) * sp * 0.85 - 1.8;
          break;
        }
        case 'spiral': {                                // ⑦ 螺旋旋涡
          const a = t * Math.PI * 2, s = cfg.speed;
          vx = Math.cos(a) * s * 0.42 - Math.sin(a) * s * 1.30;
          vy = Math.sin(a) * s * 0.42 + Math.cos(a) * s * 1.30;
          break;
        }
        case 'waterfall': {                             // ⑨ 瀑布倾泻
          const a = t * Math.PI * 2;
          vx = Math.cos(a) * sp * 0.75; vy = Math.abs(Math.sin(a)) * sp * 0.95 + 1.3;
          break;
        }
        case 'heart': {                                 // ⑧ 心形
          const th = t * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(th), 3);
          const hy = -(13 * Math.cos(th) - 5 * Math.cos(2*th) - 2 * Math.cos(3*th) - Math.cos(4*th));
          const s = cfg.speed / 15 * 0.62;
          vx = hx * s; vy = hy * s;
          break;
        }
        case 'chrysanthemum': {                         // ② 菊花：长拖尾
          const a = t * Math.PI * 2 + (Math.random() - 0.5) * 0.06;
          vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
          break;
        }
        default: {                                      // ① 牡丹：大朵球形
          const a = t * Math.PI * 2 + (Math.random() - 0.5) * 0.05;
          const s = cfg.speed * (0.55 + Math.random() * 0.75);
          vx = Math.cos(a) * s; vy = Math.sin(a) * s;
        }
      }

      particles.push(new Particle(x, y, vx, vy, col, {
        size: cfg.size + Math.random() * (cfg.sizeJit || 0),
        friction: cfg.friction, gravity: cfg.gravity, decay: cfg.decay,
        spark: cfg.spark || 0, wobble: cfg.wobble || 0,
        strobe: cfg.strobe, split: cfg.split || 0, splitN: cfg.splitN || 7,
        glow: cfg.glow || 0, trailMul: cfg.trailMul
      }));
    }
  }

  /* ---------- 12 种形态随机切换 ---------- */
  function explode(x, y, colors){
    const cols = colors || makeColors();
    const rainbow = Math.random() < 0.38;   // 约四成是彩虹渐变款
    const r = Math.random();
    let cfg;

    if(r < 0.13){        // ① 牡丹（大朵球形）
      cfg = { type:'peony', colors:cols, rainbow:rainbow, count:(48 + Math.random()*32)|0,
              speed:4.2 + Math.random()*2.8, size:1.3, sizeJit:1.4,
              friction:0.972, gravity:0.036, decay:0.0105 + Math.random()*0.004 };
    }else if(r < 0.25){  // ② 菊花（长拖尾、慢消散）
      cfg = { type:'chrysanthemum', colors:cols, rainbow:rainbow, count:(58 + Math.random()*30)|0,
              speed:3.4 + Math.random()*2.4, size:1.1, sizeJit:1.1,
              friction:0.982, gravity:0.030, decay:0.0058, trailMul:2.7, spark:0.05 };
    }else if(r < 0.34){  // ③ 柳树垂落
      cfg = { type:'willow', colors:cols, rainbow:rainbow, count:(34 + Math.random()*24)|0,
              speed:3.0 + Math.random()*1.8, size:1.7, sizeJit:1.2,
              friction:0.986, gravity:0.062, decay:0.0050, wobble:0.006, trailMul:2.2 };
    }else if(r < 0.43){  // ④ 环形
      cfg = { type:'ring', colors:cols, rainbow:rainbow, count:(42 + Math.random()*18)|0,
              speed:4.4 + Math.random()*1.6, size:1.5, sizeJit:1.0,
              friction:0.976, gravity:0.028, decay:0.0095,
              flatten:0.42 + Math.random()*0.30, glow:1 };
    }else if(r < 0.52){  // ⑤ 双层（外圈大 + 内芯错色）
      const inner = pickColors(2);
      burst(x, y, { type:'ring', colors:cols, rainbow:rainbow, count:44,
              speed:5.0, size:1.6, sizeJit:0.8, friction:0.972, gravity:0.034,
              decay:0.0115, flatten:1, glow:1 });
      cfg = { type:'peony', colors:inner, rainbow:false, count:30,
              speed:2.1, size:1.5, sizeJit:1.0, friction:0.968, gravity:0.026, decay:0.014 };
    }else if(r < 0.60){  // ⑥ 棕榈（粗壮长尾向上）
      cfg = { type:'palm', colors:cols, rainbow:rainbow, count:(16 + Math.random()*10)|0,
              speed:4.6 + Math.random()*2.0, size:2.4, sizeJit:1.4,
              friction:0.988, gravity:0.050, decay:0.0042, trailMul:3.0 };
    }else if(r < 0.68){  // ⑦ 螺旋旋涡
      cfg = { type:'spiral', colors:cols, rainbow:true, count:(46 + Math.random()*20)|0,
              speed:3.6 + Math.random()*1.6, size:1.4, sizeJit:1.1,
              friction:0.980, gravity:0.026, decay:0.0075 };
    }else if(r < 0.75){  // ⑧ 心形
      cfg = { type:'heart', colors:cols, rainbow:rainbow, count:(46 + Math.random()*16)|0,
              speed:4.8 + Math.random()*1.4, size:1.5, sizeJit:0.9,
              friction:0.978, gravity:0.022, decay:0.0098, glow:1 };
    }else if(r < 0.82){  // ⑨ 瀑布
      cfg = { type:'waterfall', colors:cols, rainbow:rainbow, count:(40 + Math.random()*20)|0,
              speed:3.2 + Math.random()*1.8, size:1.6, sizeJit:1.0,
              friction:0.984, gravity:0.055, decay:0.0060, trailMul:2.4 };
    }else if(r < 0.91){  // ⑩ 十字裂：飞行到一半二次炸开
      cfg = { type:'peony', colors:cols, rainbow:false, count:(14 + Math.random()*8)|0,
              speed:5.2 + Math.random()*1.6, size:2.0, sizeJit:0.8,
              friction:0.984, gravity:0.030, decay:0.0068,
              split:16 + Math.random()*10, splitN:7, glow:1 };
    }else{               // ⑪ 频闪（一闪一闪亮晶晶）
      cfg = { type:'peony', colors:cols, rainbow:rainbow, count:(44 + Math.random()*22)|0,
              speed:3.8 + Math.random()*2.2, size:1.8, sizeJit:1.2,
              friction:0.978, gravity:0.024, decay:0.0062, strobe:true, glow:1 };
    }

    burst(x, y, cfg);

    // 爆开瞬间的柔光闪光，让整朵更绚丽
    flashes.push({ x:x, y:y, r:46 + cfg.speed * 8, col:cols[(Math.random()*cols.length)|0], a:0.85 });
  }

  /* ---------- 主循环 ---------- */
  function loop(t){
    if(!running) return;
    if(!lastT) lastT = t;
    let dt = (t - lastT) / 16.667; lastT = t;
    if(dt > 3) dt = 3;
    if(dt <= 0) dt = 1;

    // 拖尾淡出（保留一点余晖，形成拖尾感）
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.155)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // ---- 爆开瞬间的柔光 ----
    for(let i = flashes.length - 1; i >= 0; i--){
      const f = flashes[i];
      f.a -= 0.055 * dt;
      if(f.a <= 0.01){ flashes.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0,   rgba(f.col, f.a * 0.50));
      g.addColorStop(0.4, rgba(f.col, f.a * 0.16));
      g.addColorStop(1,   rgba(f.col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fill();
    }

    // ---- 定时升空（偶尔来一次齐射） ----
    if(t > nextLaunch){
      const roll = Math.random();
      if(roll < 0.17){
        // 齐射：3~5 发同时从横向不同位置升空
        const n = 3 + ((Math.random() * 3) | 0);
        for(let i = 0; i < n; i++){
          rockets.push(new Rocket(W * (0.12 + Math.random() * 0.76)));
        }
      }else if(roll < 0.42){
        rockets.push(new Rocket()); rockets.push(new Rocket());
      }else{
        rockets.push(new Rocket());
      }
      nextLaunch = t + (W < 700 ? 620 : 440) + Math.random() * 520;
    }

    // ---- 礼花弹 ----
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      if(r.update(dt)){
        explode(r.x, r.y, r.colors);
        rockets.splice(i, 1);
      }else{
        r.draw();
      }
    }

    // ---- 粒子 ----
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.update(dt);

      // 十字裂：飞到一半二次炸开成一小簇
      if(p.justSplit){
        burst(p.x, p.y, {
          type:'peony', colors:[p.color], rainbow:false, count:p.splitN,
          speed:2.4 + Math.random() * 1.3, size:1.3, sizeJit:0.8,
          friction:0.965, gravity:0.030, decay:0.020, glow:1
        });
        particles.splice(i, 1);
        continue;
      }

      if(p.alpha <= 0.01 || p.y > H + 60){
        particles.splice(i, 1);
        continue;
      }
      p.draw();
      // 拖尾火花
      if(p.spark && Math.random() < p.spark * dt && particles.length < MAX_LIMIT){
        particles.push(new Particle(p.x, p.y, (Math.random() - 0.5) * 1.1, (Math.random() - 0.5) * 1.1,
          p.color, { size: 0.9, friction: 0.94, gravity: 0.02, decay: 0.05 }));
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    raf = requestAnimationFrame(loop);
  }

  function start(){
    if(running) return;
    running = true;
    lastT = 0;
    nextLaunch = 0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    flashes = [];
    // 开场齐射三发，气氛直接拉满
    rockets.push(new Rocket(W * 0.28));
    rockets.push(new Rocket(W * 0.52));
    rockets.push(new Rocket(W * 0.76));
    raf = requestAnimationFrame(loop);
  }

  function stop(){
    running = false;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    rockets = []; particles = []; flashes = [];
    ctx.clearRect(0, 0, W, H);
  }

  window.addEventListener('resize', resize, { passive:true });
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });

  resize();
  return { start: start, stop: stop, resize: resize };
})();


/* ---------------------------------------------------------------------------
 * 页面 4 · 游戏相册
 * -------------------------------------------------------------------------*/
const Album = (function(){
  const stage     = document.getElementById('bookStage');
  const book      = document.getElementById('book');
  const leftSlot  = $('[data-slot="left"]', book);
  const rightSlot = $('[data-slot="right"]', book);
  const prevBtn   = document.getElementById('albumPrev');
  const nextBtn   = document.getElementById('albumNext');
  const indicator = document.getElementById('albumIndicator');
  const lightbox  = document.getElementById('lightbox');
  const lightImg  = document.getElementById('lightboxImg');

  const A = CONFIG.album;

  /* 实际会尝试的后缀顺序：先探测一次真实后缀，把它排到最前面，
     这样正常情况下每张图只发 1 个请求，不会产生多余的 404。 */
  let extOrder = A.extensions.slice();

  /* 把某个格子可能的路径都列出来（不同后缀），按顺序尝试 */
  function toCandidates(arr){
    return (arr || []).map(function(s){
      if(!s) return [];
      return Array.isArray(s) ? s.slice() : [s];
    });
  }
  function autoCandidates(dirBase, i){
    return extOrder.map(function(ext){ return dirBase + i + '.' + ext; });
  }

  /* 自动模式：<folder>/<prefix><n>/<i>.<ext>
     例：page3/5.jpg  （n=跨页序号，i=照片序号，1~4 左页 / 5~8 右页） */
  function buildSpreads(){
    // 手动模式优先：CONFIG.album.spreads 里填了内容就以它为准
    if(A.spreads && A.spreads.length){
      return A.spreads.map(function(sp){
        return { left: toCandidates(sp.left), right: toCandidates(sp.right) };
      });
    }
    const root = A.folder.replace(/\/+$/, '');
    const out = [];
    for(let n = 1; n <= A.spreadCount; n++){
      const dir = root + '/' + A.prefix + n + '/';
      const left = [], right = [];
      for(let i = 1; i <= A.perPage; i++) left.push(autoCandidates(dir, i));
      for(let i = A.perPage + 1; i <= A.perPage * 2; i++) right.push(autoCandidates(dir, i));
      out.push({ left: left, right: right });
    }
    return out;
  }

  let spreads = buildSpreads();
  let index = 0, subIndex = 0, busy = false;   // subIndex：手机单页模式下 0=左页 1=右页

  const PH_HTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="4.5" width="18" height="15" rx="2.4"/><circle cx="8.6" cy="10" r="1.5"/>' +
    '<path d="M21 15.6 16.4 11l-4.1 4.1L9.8 12.6 3 19.4"/></svg><span>暂无照片</span>';

  /* 生成一个照片格子
     src 可以是一个路径字符串，也可以是一组「候选路径」（不同后缀），按顺序尝试，
     全部失败才优雅降级为占位框，过程中不报错、不弹窗。 */
  function makeCell(src){
    const cell = document.createElement('div');
    cell.className = 'photo-cell';

    const list = (Array.isArray(src) ? src : (src ? [src] : [])).filter(Boolean);
    if(!list.length){
      cell.classList.add('empty');
      cell.innerHTML = PH_HTML;
      return cell;
    }

    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    let k = 0;
    img.onerror = function(){
      k++;
      if(k < list.length){ img.src = list[k]; return; }   // 换下一个后缀再试
      cell.classList.add('empty');
      cell.innerHTML = PH_HTML;
    };
    img.onclick = function(){ openLightbox(img.currentSrc || img.src); };
    img.src = list[0];
    cell.appendChild(img);
    return cell;
  }

  /* 渲染一页（默认 9 张，3×3） */
  function fillGrid(gridEl, arr){
    gridEl.innerHTML = '';
    const list = arr || [];
    for(let i = 0; i < A.perPage; i++) gridEl.appendChild(makeCell(list[i] || ''));
  }

  /* 构建一整页 DOM（用于翻页层） */
  function buildPage(arr){
    const wrap = document.createElement('div');
    wrap.className = 'grid';
    for(let i = 0; i < A.perPage; i++) wrap.appendChild(makeCell((arr || [])[i] || ''));
    return wrap;
  }

  /* 手机竖屏只显示一页（9 张），翻页时半页半页地走 */
  function singleMode(){ return window.innerWidth < 760; }

  function paint(){
    const sp = spreads[index] || { left: [], right: [] };
    if(singleMode()){
      fillGrid(leftSlot, subIndex === 0 ? sp.left : sp.right);
    }else{
      fillGrid(leftSlot, sp.left);
      fillGrid(rightSlot, sp.right);
    }
    indicator.textContent = singleMode()
      ? (index * 2 + subIndex + 1) + ' / ' + (spreads.length * 2)
      : (index + 1) + ' / ' + spreads.length;
    prevBtn.disabled = (index === 0 && subIndex === 0);
    nextBtn.disabled = singleMode()
      ? (index >= spreads.length - 1 && subIndex === 1)
      : (index >= spreads.length - 1);
  }

  /* 自适应缩放：让整本相册尽量占满视口（四周还会预留角落装饰的位置） */
  const BASE_W = 860, BASE_H = 560, BASE_W_SINGLE = 420;
  function decoOut(){
    // 角落装饰伸出相册边缘的像素数（两侧都要留出来，避免被屏幕裁掉）
    const sz = window.innerWidth < 760 ? 52 : Math.min(118, Math.max(74, window.innerWidth * 0.074));
    const op = window.innerWidth < 760 ? 11 : 20;
    return Math.max(0, sz - op);
  }
  function fit(){
    const one = singleMode();
    book.classList.toggle('single', one);
    const bw = one ? BASE_W_SINGLE : BASE_W;
    const out = decoOut();
    const availW = Math.min(window.innerWidth - 24, 1320) - out * 2;
    const availH = window.innerHeight - (window.innerWidth < 760 ? 150 : 168) - out * 0.6;
    let s = Math.min(availW / bw, availH / BASE_H);
    s = Math.max(0.28, Math.min(s, 1.22));   // 允许放大，显著提高相册在页面中的占比
    book.style.transform = 'scale(' + s.toFixed(4) + ')';
    stage.style.width  = (bw * s) + 'px';
    stage.style.height = (BASE_H * s) + 'px';
  }

  /* 翻页：dir = 1 下一页 / -1 上一页 */
  function turn(dir){
    if(busy) return;

    /* 手机单页模式：淡出 → 换内容 → 淡入，一次走半页 */
    if(singleMode()){
      let idx = index, sub = subIndex + dir;
      if(sub > 1){ sub = 0; idx++; }
      else if(sub < 0){ sub = 1; idx--; }
      if(idx < 0 || idx >= spreads.length) return;
      if(idx === spreads.length - 1 && sub === 1 && dir > 0){
        // 最后一页：若右页整页都是空的就不翻过去，免得看到一页空白
        const r = spreads[idx].right || [];
        const any = r.some(function(x){ return x && x.length; });
        if(!any) return;
      }
      busy = true;
      index = idx; subIndex = sub;
      book.classList.add('turning');
      setTimeout(function(){
        paint();
        book.classList.remove('turning');
        busy = false;
      }, 270);
      return;
    }

    if(dir > 0 && index >= spreads.length - 1) return;
    if(dir < 0 && index <= 0) return;
    busy = true;
    subIndex = 0;

    const layer = document.createElement('div');
    layer.className = 'flip-layer ' + (dir > 0 ? 'flip-next' : 'flip-prev');

    const front = document.createElement('div');
    front.className = 'flip-face ' + (dir > 0 ? 'flip-front' : 'flip-front');
    const back = document.createElement('div');
    back.className = 'flip-face flip-back';

    if(dir > 0){
      // 右页向左翻：正面=当前右页，背面=下一页左页
      front.appendChild(buildPage(spreads[index].right));
      back.appendChild(buildPage(spreads[index + 1].left));
      // 被遮住的下层右页先悄悄换成新内容
      fillGrid(rightSlot, spreads[index + 1].right);
    }else{
      // 左页向右翻：正面=当前左页，背面=上一页右页
      front.appendChild(buildPage(spreads[index].left));
      back.appendChild(buildPage(spreads[index - 1].right));
      fillGrid(leftSlot, spreads[index - 1].left);
    }
    layer.appendChild(front);
    layer.appendChild(back);
    book.appendChild(layer);

    const finish = function(){
      if(!busy) return;
      layer.removeEventListener('transitionend', finish);
      index += dir;
      paint();
      if(layer.parentNode) layer.remove();
      busy = false;
    };
    layer.addEventListener('transitionend', finish);
    setTimeout(finish, 900);   // 兜底，防止 transitionend 丢失

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        layer.style.transform = dir > 0 ? 'rotateY(-180deg)' : 'rotateY(180deg)';
      });
    });
  }

  /* 大图 */
  function openLightbox(src){
    lightImg.src = src;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    setTimeout(function(){ lightImg.src = ''; }, 420);
  }

  on(prevBtn, 'click', function(){ turn(-1); });
  on(nextBtn, 'click', function(){ turn(1); });
  on(lightbox, 'click', closeLightbox);
  on(document.getElementById('lightboxClose'), 'click', function(e){ e.stopPropagation(); closeLightbox(); });

  // 键盘左右翻页 / ESC 关闭大图
  window.addEventListener('keydown', function(e){
    if(Router.current !== 'page4') return;
    if(e.key === 'ArrowLeft') turn(-1);
    else if(e.key === 'ArrowRight') turn(1);
    else if(e.key === 'Escape') closeLightbox();
  });

  // 窗口变化时重算尺寸；横竖屏 / 单双页模式切换时顺带重绘内容
  window.addEventListener('resize', function(){
    const was = book.classList.contains('single');
    fit();
    if(!busy && book.classList.contains('single') !== was) paint();
  }, { passive:true });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ fit(); if(!busy) paint(); }, 300);
  });

  fit();      // 先定尺寸（同时决定单页 / 双页模式），再渲染内容
  paint();

  /* 开站时悄悄探测一次：你的照片用的是哪个后缀（jpg / png / …）。
     探测到就把它排到最前，这样每张图只发 1 个请求；探测不到也不影响，
     会按顺序逐个试，全部失败才显示占位框。 */
  (function detectExtension(){
    const root = A.folder.replace(/\/+$/, '');
    let i = 0;
    function next(){
      if(i >= A.extensions.length) return;
      const ext = A.extensions[i++];
      const probe = new Image();
      probe.onload = function(){
        if(extOrder[0] === ext) return;
        extOrder = [ext].concat(A.extensions.filter(function(e){ return e !== ext; }));
        spreads = buildSpreads();
        if(index >= spreads.length) index = Math.max(0, spreads.length - 1);
        // 只在相册正在显示、且没在翻页时重绘，避免打断翻页动画
        const p4 = document.getElementById('page4');
        if(p4 && p4.classList.contains('active') && !busy) paint();
      };
      probe.onerror = next;
      probe.src = root + '/' + A.prefix + '1/1.' + ext;
    }
    next();
  })();

  return { fit: fit, turn: turn, closeLightbox: closeLightbox };
})();


/* ---------------------------------------------------------------------------
 * 页面 5 · 时光机
 * -------------------------------------------------------------------------*/
const TimeMachine = (function(){
  const timelineEl = document.getElementById('timeline');
  const wallEl     = document.getElementById('noteWall');
  const daysEl     = document.getElementById('daysNum');
  const input      = document.getElementById('wishInput');
  const submitBtn  = document.getElementById('wishSubmit');
  const historyBtn = document.getElementById('wishHistory');
  const modal      = document.getElementById('wishModal');
  const modalClose = document.getElementById('wishModalClose');
  const listEl     = document.getElementById('wishList');
  const countEl    = document.getElementById('wishCount');
  const page       = document.getElementById('page5');

  const KEY = CONFIG.wishStorageKey;
  let io = null;

  /* ---------- 时光轴 ---------- */
  function renderTimeline(){
    timelineEl.innerHTML = '';
    CONFIG.timeline.forEach(function(item){
      const node = document.createElement('div');
      if(item.ellipsis){
        node.className = 'tl-node ellipsis reveal';
        node.innerHTML = '<span class="tl-dot"></span>' +
          '<div class="tl-card"><div class="tl-dots">······</div></div>';
      }else{
        node.className = 'tl-node reveal';
        node.innerHTML = '<span class="tl-dot"></span>' +
          '<div class="tl-card">' +
            '<div class="tl-date">' + item.date + '</div>' +
            '<div class="tl-name">' + item.name + '</div>' +
            (item.desc ? '<div class="tl-desc">' + item.desc + '</div>' : '') +
          '</div>';
      }
      timelineEl.appendChild(node);
    });
  }

  /* ---------- 祝福墙 ---------- */
  function renderWall(){
    wallEl.innerHTML = '';
    CONFIG.blessings.forEach(function(txt, i){
      const n = document.createElement('div');
      n.className = 'note note-' + (i % 6);
      // 轻微倾斜，错落排布
      const rot = ((i * 37) % 9) - 4;         // -4 ~ +4 度
      const dy  = ((i * 53) % 15) - 7;        // 上下轻微错落
      n.style.transform = 'rotate(' + rot + 'deg) translateY(' + dy + 'px)';
      n.dataset.rot = rot;
      n.dataset.dy = dy;
      const span = document.createElement('span');
      span.textContent = txt;
      n.appendChild(span);
      // 悬停上浮（保持原有倾斜角度）
      n.addEventListener('pointerenter', function(){ n.style.transform = 'rotate(0deg) translateY(-9px) scale(1.035)'; });
      n.addEventListener('pointerleave', function(){ n.style.transform = 'rotate(' + rot + 'deg) translateY(' + dy + 'px)'; });
      n.addEventListener('click', function(){ n.style.transform = 'rotate(' + rot + 'deg) translateY(' + dy + 'px)'; });
      wallEl.appendChild(n);
    });
  }

  /* ---------- 滚动进入动画（滚到哪亮到哪） ---------- */
  function bindReveal(){
    if(io){ io.disconnect(); io = null; }
    if(!('IntersectionObserver' in window)){
      $$('.reveal', page).forEach(function(el){ el.classList.add('show'); });
      return;
    }
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting) en.target.classList.add('show');
      });
    }, { root: page, threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    $$('.reveal', page).forEach(function(el){ io.observe(el); });
  }

  /* ---------- 天数计算（每次打开自动更新） ---------- */
  function calcDays(){
    const p = String(CONFIG.startDate || '').split('-');
    if(p.length !== 3) { daysEl.textContent = '—'; return; }
    const start = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    start.setHours(0, 0, 0, 0);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const d = Math.floor((now - start) / 86400000) + 1;
    daysEl.textContent = d > 0 ? String(d) : '0';
  }

  /* ---------- 许愿数据 ---------- */
  function loadWishes(){
    try{
      const raw = localStorage.getItem(KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveWishes(arr){
    try{ localStorage.setItem(KEY, JSON.stringify(arr)); }catch(e){}
  }
  function fmtTime(ts){
    const d = new Date(ts);
    function p2(n){ return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '.' + p2(d.getMonth() + 1) + '.' + p2(d.getDate()) +
           ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  /* ---------- 许愿泡泡动画 ---------- */
  function bubbleAway(text){
    const el = document.createElement('div');
    el.className = 'wish-bubble';
    el.textContent = text;

    const r = input.getBoundingClientRect();
    const size = window.innerWidth < 560 ? 124 : 150;
    const sx = r.left + r.width / 2 - size / 2;
    const sy = r.top + r.height / 2 - size / 2;
    el.style.left = sx + 'px';
    el.style.top  = sy + 'px';
    document.body.appendChild(el);

    // 缓动的曲线飘走轨迹：向右上方飘，最后缩成小泡泡消失
    const dir = Math.random() < 0.78 ? 1 : -1;
    const dx = dir * (110 + Math.random() * 90);
    const dy = -(150 + Math.random() * 130);

    const frames = [
      { transform: 'translate(0px,0px) scale(.45)',                                  opacity: 0,    offset: 0    },
      { transform: 'translate(' + (dx*0.12) + 'px,' + (dy*0.30) + 'px) scale(1)',     opacity: 1,    offset: 0.16 },
      { transform: 'translate(' + (dx*0.42) + 'px,' + (dy*0.70) + 'px) scale(1.03)',  opacity: 0.95, offset: 0.40 },
      { transform: 'translate(' + (dx*0.74) + 'px,' + (dy*0.94) + 'px) scale(.86)',   opacity: 0.72, offset: 0.66 },
      { transform: 'translate(' + (dx*0.94) + 'px,' + (dy*1.06) + 'px) scale(.6)',    opacity: 0.34, offset: 0.86 },
      { transform: 'translate(' + dx + 'px,' + (dy*1.12) + 'px) scale(.22)',          opacity: 0,    offset: 1    }
    ];

    if(el.animate){
      const anim = el.animate(frames, {
        duration: 3400,
        easing: 'cubic-bezier(.34,.05,.3,1)',
        fill: 'forwards'
      });
      anim.onfinish = function(){ if(el.parentNode) el.remove(); };
      setTimeout(function(){ if(el.parentNode) el.remove(); }, 4200);
    }else{
      // 老浏览器降级：直接淡出
      el.style.transition = 'transform 2.6s cubic-bezier(.34,.05,.3,1), opacity 2.6s ease';
      requestAnimationFrame(function(){
        el.style.transform = 'translate(' + dx + 'px,' + (dy*1.1) + 'px) scale(.2)';
        el.style.opacity = '0';
      });
      setTimeout(function(){ if(el.parentNode) el.remove(); }, 3000);
    }
  }

  function addWish(){
    const text = (input.value || '').trim();
    if(!text) { input.focus(); return; }
    const arr = loadWishes();
    arr.push({ t: text, ts: Date.now() });
    saveWishes(arr);
    input.value = '';
    input.blur();
    bubbleAway(text);
  }

  /* ---------- 历史许愿弹窗 ---------- */
  function renderList(){
    const arr = loadWishes();
    listEl.innerHTML = '';
    countEl.textContent = '共 ' + arr.length + ' 条';
    if(!arr.length){
      const d = document.createElement('div');
      d.className = 'empty-tip';
      d.textContent = '还没有许过愿哦';
      listEl.appendChild(d);
      return;
    }
    // 最新的放最上面
    for(let i = arr.length - 1; i >= 0; i--){
      const it = arr[i];
      const row = document.createElement('div');
      row.className = 'wish-item';
      row.style.animationDelay = Math.min(0.4, (arr.length - 1 - i) * 0.045) + 's';
      const idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = i + 1;
      const body = document.createElement('div');
      body.className = 'body';
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = it.t;
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = fmtTime(it.ts || Date.now());
      body.appendChild(txt); body.appendChild(time);
      row.appendChild(idx); row.appendChild(body);
      listEl.appendChild(row);
    }
  }
  function openModal(){ renderList(); modal.classList.add('show'); }
  function closeModal(){ modal.classList.remove('show'); }

  on(submitBtn, 'click', addWish);
  on(input, 'keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addWish(); } });
  on(historyBtn, 'click', openModal);
  on(modalClose, 'click', closeModal);
  on(modal, 'click', function(e){ if(e.target === modal) closeModal(); });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  /* ---------- 刷新（进入页面时调用） ---------- */
  function refresh(){
    calcDays();
    bindReveal();
  }

  renderTimeline();
  renderWall();
  calcDays();
  bindReveal();
  // 日期跨天时自动更新
  setInterval(calcDays, 60000);

  return { refresh: refresh, closeModal: closeModal };
})();


/* ---------------------------------------------------------------------------
 * 全局：窗口尺寸变化
 * -------------------------------------------------------------------------*/
let resizeTimer = null;
window.addEventListener('resize', function(){
  if(resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    Album.fit();
  }, 180);
}, { passive:true });
</script>

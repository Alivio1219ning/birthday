<head>

<!--
  ============================================================================
  生日主题网站 · 韩式 ins 风 / 梦幻 / 星空
  ----------------------------------------------------------------------------
  【隐私提醒】本页面为公网可访问页面。即使设置了密码，也请不要放入真实姓名、
  真实住址、学校 / 公司、证件号、联系方式等任何隐私信息。
  全站称呼一律使用昵称：周周米玉 / 玉米周周 / 周周小弟 / 阿殊大王。
  ============================================================================
  纯 HTML + CSS + 原生 JS，无任何构建工具、无外部 CDN 依赖，可直接上传 GitHub Pages。
  所有资源使用相对路径（不以 / 开头），支持部署在 https://用户名.github.io/仓库名/ 子路径下。
  ============================================================================
  ★★★ 我只想换素材，该改哪里？★★★
  在编辑器里搜索下面这 3 个标记，就能直接跳到对应位置：
    【1】音乐：搜   【请在这里替换你的音乐文件】
         → 其实只要把 mp3 丢进 bgm/ 就行，不用改代码。
    【2】照片：搜   【最简单用法：把照片丢进文件夹就行，一行代码都不用改】
         → 其实只要把照片丢进 page1/ ~ page7/ 并命名为 1.jpg~18.jpg 就行，
           一共 7 × 18 = 126 张，不用改代码。
    【3】密码 / 文字：搜   【  配 置 区  ·  只 需 要 改 这 里  】
         → 密码、祝福语、时间轴文案都在这里。
  ============================================================================
-->
<title>生日快乐 · 秘密基地</title>
<style>
/* ==========================================================================
   0. 全局变量与基础重置
   ========================================================================== */
:root{
  /* ---- 主色调：浅蓝 / 雾霾蓝 / 冰蓝 / 奶油白 / 银灰（整体浅色韩系 ins 风） ---- */
  --ink:        #32485f;   /* 主文字（深蓝灰，浅底上清晰） */
  --ink-soft:   #5b738e;   /* 次文字 */
  --muted:      #90a7bd;   /* 弱文字 */
  --ice:        #4276ad;   /* 冰蓝（强调色） */
  --blue:       #6fa3d6;   /* 雾霾蓝 */
  --blue-deep:  #2f5c8f;
  --cream:      #ffffff;   /* 奶油白 */
  --silver:     #c3d3e3;   /* 银灰 */
  --violet:     #a99ae0;   /* 极淡浅紫（点缀） */
  --err:        #e2637c;   /* 错误提示红 */

  /* ---- 玻璃拟态（浅底白玻璃） ---- */
  --glass-bg:      rgba(255,255,255,.55);
  --glass-bg-2:    rgba(255,255,255,.72);
  --glass-line:    rgba(255,255,255,.85);
  --glass-line-2:  rgba(158,193,228,.55);
  --glass-shadow:  0 16px 42px rgba(122,163,210,.20), inset 0 1px 0 rgba(255,255,255,.95);

  /* ---- 动效曲线 ---- */
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-soft: cubic-bezier(.33,.05,.3,1);
  --ease-back: cubic-bezier(.34,1.4,.5,1);

  /* ---- 字体：优先系统优雅衬线 / 圆润无衬线，不引用任何 CDN ---- */
  --font-serif: "Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",
                "LXGW WenKai","霞鹜文楷","KaiTi",Georgia,serif;
  --font-sans:  -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",
                "Microsoft YaHei UI","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; padding:0; }
body{
  font-family:var(--font-sans);
  color:var(--ink);
  overflow:hidden;                 /* 页面内部各自滚动 */
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
}
button{ font-family:inherit; color:inherit; cursor:pointer; border:0; background:none; }
input{ font-family:inherit; }
img{ display:block; max-width:100%; }
::selection{ background:rgba(127,178,229,.35); }

/* 细腻滚动条 */
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.24); }
::-webkit-scrollbar-track{ background:transparent; }

/* ==========================================================================
   1. 全站固定星空背景层（所有页面共用）
   ========================================================================== */
/* 浅蓝白色系韩系 ins 风底：奶油白 → 雾霾蓝，多层柔和光晕 */
#bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 640px at 12% 6%,  rgba(255,255,255,.98), transparent 62%),
    radial-gradient(840px 720px at 88% 84%, rgba(197,216,247,.78), transparent 66%),
    radial-gradient(700px 560px at 62% 26%, rgba(216,234,253,.72), transparent 70%),
    radial-gradient(560px 440px at 28% 92%, rgba(227,215,250,.55), transparent 72%),
    radial-gradient(520px 420px at 78% 34%, rgba(255,255,255,.75), transparent 68%),
    linear-gradient(165deg,#f4f9ff 0%,#dcebfb 42%,#eaf3ff 100%);
}
/* 漂浮光点层：韩系柔焦光斑 + 细碎闪点 + 流动四角星细闪（所有页面都有） */
#starfield{
  position:fixed; inset:0; z-index:2; pointer-events:none; display:block;
  mix-blend-mode:screen;
}
/* 烟花页的暮蓝夜空（放在根层级，且压在闪点层之下，让细闪也能透出来） */
#fwBg{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  opacity:0; visibility:hidden;
  transition:opacity .6s var(--ease), visibility 0s linear .6s;
  background:
    radial-gradient(760px 560px at 22% 18%, rgba(104,158,232,.38), transparent 66%),
    radial-gradient(700px 620px at 78% 74%, rgba(146,116,226,.30), transparent 68%),
    radial-gradient(560px 420px at 55% 50%, rgba(120,190,245,.14), transparent 70%),
    linear-gradient(170deg,rgba(24,46,82,.92) 0%,rgba(33,63,108,.90) 45%,rgba(47,84,136,.93) 100%);
}
#fwBg.on{
  opacity:1; visibility:visible;
  transition:opacity .6s var(--ease), visibility 0s linear 0s;
}
/* 漂浮装饰层：可爱的卡通玉米 + 甜品简笔画（所有页面背景都有） */
#floaties{
  position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden;
}
.floaty{
  position:absolute;
  will-change:transform;
  animation:floatDrift 20s ease-in-out infinite;
  filter:drop-shadow(0 8px 14px rgba(96,140,190,.22));
}
.floaty-in{
  width:100%; height:100%;
  animation:floatSpin 12s ease-in-out infinite;
}
.floaty svg{ width:100%; height:100%; display:block; overflow:visible; }
@keyframes floatDrift{
  0%  { transform:translate3d(0,0,0); }
  25% { transform:translate3d(var(--dx,12px), calc(var(--dy,26px) * -1), 0); }
  50% { transform:translate3d(0, calc(var(--dy,26px) * -1.7), 0); }
  75% { transform:translate3d(calc(var(--dx,12px) * -1), var(--dy,26px), 0); }
  100%{ transform:translate3d(0,0,0); }
}
@keyframes floatSpin{
  0%,100%{ transform:rotate(var(--r0,-6deg)) scale(1); }
  50%    { transform:rotate(var(--r1,8deg)) scale(1.07); }
}

/* ==========================================================================
   2. 页面容器与切换过渡
   ========================================================================== */
#app{ position:relative; z-index:5; }
.page{
  position:fixed; inset:0;
  opacity:0; visibility:hidden; pointer-events:none;
  overflow-y:auto; overflow-x:hidden;
  /* 滚动条的位置永久预留：内容多寡变化时不会出现「多出/少掉一条滚动条」
     把居中内容左右推一下的情况（看起来就像整页在晃）。 */
  scrollbar-gutter:stable both-edges;
  -webkit-overflow-scrolling:touch;
  transform:translateY(12px) scale(.995);
  transition:
    opacity .58s var(--ease),
    transform .58s var(--ease),
    visibility 0s linear .58s;
}
.page.active{
  opacity:1; visibility:visible; pointer-events:auto;
  transform:none;
  transition:
    opacity .58s var(--ease),
    transform .58s var(--ease),
    visibility 0s linear 0s;
}
.page-inner{
  min-height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:clamp(20px,4vw,48px);
  position:relative; z-index:1;
}
.page-inner.top{ justify-content:flex-start; padding-top:clamp(74px,9vh,110px); }

/* 通用玻璃卡片 */
.glass{
  background:var(--glass-bg);
  border:1px solid var(--glass-line);
  border-radius:22px;
  backdrop-filter:blur(16px) saturate(130%);
  -webkit-backdrop-filter:blur(16px) saturate(130%);
  box-shadow:var(--glass-shadow);
}

/* 返航按钮 */
.back-btn{
  position:fixed; top:clamp(14px,2.4vw,26px); left:clamp(14px,2.4vw,26px); z-index:60;
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px 9px 13px;
  font-size:13px; letter-spacing:.14em; color:var(--ink-soft);
  border-radius:100px;
  background:var(--glass-bg-2);
  border:1px solid var(--glass-line);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  transition:transform .35s var(--ease-back), background .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
}
.back-btn:hover{ transform:translateX(-3px) scale(1.04); background:rgba(255,255,255,.14); color:#fff; border-color:var(--glass-line-2); }
.back-btn:active{ transform:scale(.96); }
.back-btn svg{ width:14px; height:14px; }

/* 音乐开关按钮（每个有 BGM 的页面右上角） */
.music-btn{
  position:fixed; top:clamp(14px,2.4vw,26px); right:clamp(14px,2.4vw,26px); z-index:60;
  width:46px; height:46px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--glass-bg-2);
  border:1px solid var(--glass-line);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 28px rgba(96,140,190,.22);
  transition:transform .35s var(--ease-back), background .3s var(--ease), border-color .3s var(--ease);
  opacity:0; visibility:hidden;
}
.music-btn.show{ opacity:1; visibility:visible; }
.music-btn:hover{ transform:scale(1.08); background:rgba(255,255,255,.15); }
.music-btn:active{ transform:scale(.94); }
.music-btn svg{ width:19px; height:19px; color:var(--blue-deep); }
.music-btn .ico-off{ display:none; }
.music-btn.muted .ico-on{ display:none; }
.music-btn.muted .ico-off{ display:block; }
.music-btn .ring{
  position:absolute; inset:-4px; border-radius:50%;
  border:1px solid rgba(111,163,214,.55);
  opacity:0;
}
.music-btn:not(.muted) .ring{ animation:ringPulse 2.6s var(--ease) infinite; }
@keyframes ringPulse{
  0%{ opacity:.55; transform:scale(.9); }
  70%{ opacity:0; transform:scale(1.35); }
  100%{ opacity:0; transform:scale(1.35); }
}

/* 标题通用 */
.page-title{
  font-family:var(--font-serif);
  font-weight:500;
  letter-spacing:.14em;
  font-size:clamp(20px,3.4vw,30px);
  margin:0 0 clamp(18px,3vw,34px);
  color:var(--blue-deep);
  text-shadow:0 2px 18px rgba(255,255,255,.9);
  text-align:center;
}

/* 通用按钮 */
.primary-btn{
  padding:12px 30px; border-radius:100px;
  font-size:14px; letter-spacing:.18em;
  color:#08131f;
  background:linear-gradient(135deg,#e8f3ff 0%,#bcdcfb 45%,#9dc6ef 100%);
  box-shadow:0 12px 34px rgba(120,180,240,.30), inset 0 1px 0 rgba(255,255,255,.85);
  transition:transform .32s var(--ease-back), box-shadow .32s var(--ease), filter .3s var(--ease);
}
.primary-btn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 18px 44px rgba(120,180,240,.42), inset 0 1px 0 rgba(255,255,255,.9); }
.primary-btn:active{ transform:scale(.97); }
.ghost-btn{
  padding:10px 22px; border-radius:100px;
  font-size:13px; letter-spacing:.16em; color:var(--ink-soft);
  background:var(--glass-bg); border:1px solid var(--glass-line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:transform .32s var(--ease-back), background .3s var(--ease), color .3s var(--ease);
}
.ghost-btn:hover{ transform:translateY(-2px); background:rgba(255,255,255,.12); color:#fff; }
.ghost-btn:active{ transform:scale(.97); }

/* ==========================================================================
   3. 页面 0 · 密码门
   ========================================================================== */
#page0 .page-inner{ gap:0; }
.gate-box{
  width:min(420px,90vw);
  padding:clamp(30px,5vw,48px) clamp(24px,5vw,44px);
  border-radius:26px;
  display:flex; flex-direction:column; align-items:center;
  animation:fadeUp .9s var(--ease-soft) both;
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(26px); }
  to  { opacity:1; transform:none; }
}
.gate-moon{
  width:56px; height:56px; margin-bottom:22px; border-radius:50%;
  background:linear-gradient(145deg,#ffffff 0%,#dcecff 45%,#a9c9ea 100%);
  box-shadow:0 12px 30px rgba(122,163,210,.35), inset -6px -6px 16px rgba(140,180,225,.28), inset 4px 4px 14px rgba(255,255,255,.9);
  animation:moonFloat 6s ease-in-out infinite;
}
@keyframes moonFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-8px); }
}
.gate-title{
  font-family:var(--font-serif);
  font-size:clamp(17px,2.6vw,21px);
  letter-spacing:.3em; font-weight:400;
  color:var(--blue-deep); margin:0 0 26px;
}
/* 密码输入框：无任何 placeholder，内部完全空白 */
.gate-input{
  width:100%;
  padding:15px 20px;
  font-size:17px; letter-spacing:.5em; text-indent:.5em; text-align:center;
  color:var(--ink);
  background:rgba(255,255,255,.72);
  border:1px solid rgba(170,200,232,.75);
  border-radius:14px;
  outline:none;
  transition:border-color .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
}
.gate-input:focus{
  border-color:rgba(111,163,214,.95);
  background:rgba(255,255,255,.92);
  box-shadow:0 0 0 4px rgba(140,190,255,.22);
}
.gate-input.wrong{
  border-color:var(--err);
  background:rgba(255,255,255,.92);
  box-shadow:0 0 0 4px rgba(226,99,124,.16);
  animation:shake .45s cubic-bezier(.36,.07,.19,.97);
}
/* 确认按钮 */
.gate-btn{
  margin-top:20px; width:100%;
  padding:14px 30px; border-radius:100px;
  font-size:14px; letter-spacing:.4em; text-indent:.4em;
  color:#ffffff;
  background:linear-gradient(135deg,#8fbbe6 0%,#6ea3d8 45%,#4d84bd 100%);
  box-shadow:0 12px 28px rgba(90,140,200,.35), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .32s var(--ease-back), box-shadow .32s var(--ease), filter .3s var(--ease);
}
.gate-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 36px rgba(90,140,200,.45), inset 0 1px 0 rgba(255,255,255,.6); }
.gate-btn:active{ transform:translateY(0) scale(.97); }
.gate-btn:disabled{ opacity:.55; cursor:default; transform:none; box-shadow:none; }
/* 密码错误提示 */
.gate-error{
  margin:16px 0 0; min-height:1em;
  font-size:12px; letter-spacing:.24em;
  color:var(--err);
  opacity:0; transform:translateY(-4px);
  transition:opacity .32s var(--ease), transform .32s var(--ease);
}
.gate-error.show{ opacity:1; transform:none; }
@keyframes shake{
  10%,90%{ transform:translateX(-2px); }
  20%,80%{ transform:translateX(4px); }
  30%,50%,70%{ transform:translateX(-7px); }
  40%,60%{ transform:translateX(7px); }
}
.gate-hint{
  margin:14px 0 0; font-size:11.5px; letter-spacing:.2em;
  color:var(--muted); opacity:.85;
}

/* ==========================================================================
   4. 页面 1 · 生日快乐
   ========================================================================== */
.birth-title{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:clamp(30px,7vw,62px);
  letter-spacing:.1em;
  margin:0 0 clamp(4px,1.5vw,12px);
  text-align:center;
  background:linear-gradient(180deg,#2b5586 0%,#4f8ecb 48%,#7db2e0 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  filter:drop-shadow(0 3px 14px rgba(255,255,255,.85));
  animation:titleIn 1.2s var(--ease-soft) both;
}
@keyframes titleIn{
  from{ opacity:0; transform:translateY(34px) scale(.97); filter:blur(8px) drop-shadow(0 0 0 rgba(255,255,255,0)); }
  to  { opacity:1; transform:none; filter:blur(0) drop-shadow(0 3px 14px rgba(255,255,255,.85)); }
}
.birth-sub{
  font-size:clamp(11px,1.7vw,13.5px); letter-spacing:.34em; color:var(--muted);
  margin:0 0 clamp(10px,2vw,20px);
  animation:fadeUp 1.2s .25s var(--ease-soft) both;
}
.cake-hint-top{
  font-family:var(--font-serif);
  font-size:clamp(13px,2vw,16px); letter-spacing:.2em;
  color:var(--ink-soft); margin-bottom:6px;
  animation:fadeUp 1.2s .4s var(--ease-soft) both;
}
.cake-wrap{
  display:flex; flex-direction:column; align-items:center;
  animation:fadeUp 1.3s .45s var(--ease-soft) both;
}
.cake-svg{
  width:min(360px,74vw); height:auto; display:block;
  cursor:pointer;
  filter:drop-shadow(0 22px 34px rgba(96,140,190,.32));
  transition:transform .5s var(--ease-back);
}
.cake-svg:hover{ transform:translateY(-4px) scale(1.015); }
.cake-svg:active{ transform:scale(.985); }
.cake-svg.blown{ cursor:default; }
.cake-hint-bottom{
  margin-top:-4px;
  font-size:clamp(11px,1.7vw,13px); letter-spacing:.26em; color:var(--muted);
  animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{ opacity:.55; }
  50%{ opacity:1; }
}

/* 烛火摇曳 */
.flame{ transform-box:fill-box; transform-origin:50% 100%; animation:flicker var(--d,2s) ease-in-out infinite; }
@keyframes flicker{
  0%  { transform:scale(1,1) rotate(0deg); }
  22% { transform:scale(.93,1.09) rotate(-2.4deg); }
  45% { transform:scale(1.05,.93) rotate(2.2deg); }
  68% { transform:scale(.96,1.05) rotate(-1.2deg); }
  100%{ transform:scale(1,1) rotate(0deg); }
}
.cake-svg.blown .flame{
  animation:none;
  transform:scale(.05,.3) translateY(6px);
  opacity:0;
  transition:transform .38s var(--ease), opacity .38s var(--ease);
}
.smoke{
  opacity:0;
  transform-box:fill-box; transform-origin:50% 100%;
}
.cake-svg.blown .smoke{ animation:smokeUp 1.9s .12s var(--ease-soft) forwards; }
@keyframes smokeUp{
  0%  { opacity:0;   transform:translateY(8px) scale(.6,.5); }
  22% { opacity:.7;   transform:translateY(-10px) scale(.9,1); }
  60% { opacity:.42; transform:translateY(-34px) scale(1.25,1.5) translateX(6px); }
  100%{ opacity:0;   transform:translateY(-62px) scale(1.9,2.2) translateX(-6px); }
}

/* ==========================================================================
   5. 页面 2 · 三模块基地
   ========================================================================== */
.hub-title{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:clamp(21px,4.2vw,40px);
  letter-spacing:.12em;
  text-align:center;
  margin:0 0 clamp(28px,5vw,52px);
  background:linear-gradient(180deg,#2b5586 0%,#5b95d0 52%,#87b9e3 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 14px rgba(255,255,255,.9));
  animation:fadeUp 1s var(--ease-soft) both;
}
.hub-grid{
  display:flex; gap:clamp(14px,2.6vw,30px);
  width:100%; max-width:980px; justify-content:center;
  flex-wrap:wrap;
}
.hub-card{
  position:relative; overflow:hidden;
  flex:1 1 210px; max-width:280px; min-height:216px;
  padding:30px 22px 26px;
  border-radius:24px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:var(--glass-bg);
  border:1px solid var(--glass-line);
  backdrop-filter:blur(16px) saturate(130%); -webkit-backdrop-filter:blur(16px) saturate(130%);
  box-shadow:var(--glass-shadow);
  transition:transform .45s var(--ease-back), border-color .45s var(--ease), box-shadow .45s var(--ease), background .45s var(--ease);
  animation:fadeUp .9s var(--ease-soft) both;
}
.hub-card:nth-child(1){ animation-delay:.10s; }
.hub-card:nth-child(2){ animation-delay:.20s; }
.hub-card:nth-child(3){ animation-delay:.30s; }
/* 光晕跟随鼠标（--mx / --my 由 JS 写入） */
.hub-card::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.92), transparent 66%);
  opacity:0; transition:opacity .45s var(--ease);
}
.hub-card:hover{ transform:translateY(-8px) scale(1.03); border-color:rgba(255,255,255,.95); background:rgba(255,255,255,.78);
  box-shadow:0 24px 52px rgba(122,163,210,.28), 0 0 30px rgba(255,255,255,.75), inset 0 1px 0 rgba(255,255,255,.95); }
.hub-card:hover::before{ opacity:1; }
.hub-card:active{ transform:translateY(-2px) scale(.99); }
.hub-ico{
  width:60px; height:60px; border-radius:20px;
  display:grid; place-items:center;
  background:linear-gradient(150deg,rgba(255,255,255,.98),rgba(214,233,251,.88));
  border:1px solid rgba(172,203,234,.85);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 8px 20px rgba(122,163,210,.22);
  transition:transform .5s var(--ease-back);
}
.hub-card:hover .hub-ico{ transform:translateY(-3px) rotate(-4deg) scale(1.06); }
.hub-ico svg{ width:28px; height:28px; color:var(--ice); }
.hub-name{ font-family:var(--font-serif); font-size:clamp(16px,2.2vw,19px); letter-spacing:.2em; color:var(--ink); }
.hub-desc{ font-size:11.5px; letter-spacing:.16em; color:var(--muted); }

/* ==========================================================================
   5.5 页面 2 的装饰
   —— 王冠 / 玉米（标题上方）、旋转木马（右下）、草莓蛋糕（左下）、
      温柔浮光（缓缓掠过）、中等五角星（闪烁）
   ========================================================================== */

/* ---------- 标题上方的王冠与玉米 ---------- */
/* 注意：.hub-title 用了 background-clip:text 渐变文字，
   Chromium 下 inline-block 子元素会切断渐变裁剪导致文字透明，
   所以 .ti 必须自带同一份渐变，否则「阿殊」「周周」会隐形 */
.ti{
  position:relative; display:inline-block;
  background:linear-gradient(180deg,#2b5586 0%,#5b95d0 52%,#87b9e3 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.ti-deco{
  position:absolute; left:50%; bottom:100%;
  transform:translateX(-50%);
  transform-origin:50% 100%;
  pointer-events:none; overflow:visible;
}
.ti-crown{
  width:clamp(28px,3.6vw,42px); height:auto; margin-bottom:3px;
  filter:drop-shadow(0 3px 6px rgba(196,150,50,.45));
  animation:crownFloat 3.6s ease-in-out infinite;
}
@keyframes crownFloat{
  0%,100%{ transform:translateX(-50%) translateY(0)    rotate(-3deg); }
  50%    { transform:translateX(-50%) translateY(-5px) rotate(3deg);  }
}
.cw-shine{ animation:crownShine 2.8s ease-in-out infinite; }
@keyframes crownShine{ 0%,100%{ opacity:.15 } 50%{ opacity:.9 } }
.cw-gem{ animation:crownGem 3.2s ease-in-out infinite; transform-origin:center; }
.cw-gem.g2{ animation-delay:.5s; }
.cw-gem.g3{ animation-delay:1.1s; }
@keyframes crownGem{ 0%,100%{ opacity:.75 } 50%{ opacity:1 } }

.ti-corn{
  width:clamp(24px,3vw,34px); height:auto; margin-bottom:2px;
  filter:drop-shadow(0 3px 5px rgba(150,180,120,.4));
  animation:cornSway 3s ease-in-out infinite;
}
@keyframes cornSway{
  0%,100%{ transform:translateX(-50%) rotate(-8deg); }
  50%    { transform:translateX(-50%) rotate(8deg);   }
}

/* ---------- 秘密基地的装饰层（第 2 页） ----------
   浮光、五角星、草莓蛋糕、旋转木马全部装在 .hub-deco 里：
   整层 overflow:hidden + pointer-events:none，
   装饰怎么动都不会影响到正文排版，也不会撑出滚动条让整页抖动。 */
.hub-deco{
  position:absolute; inset:0; overflow:hidden;
  pointer-events:none;
  z-index:2;
}
.hub-deco > *{ pointer-events:none; }
.hub-deco .sbcake,
.hub-deco .carousel{ pointer-events:auto; }

/* ---------- 温柔的浮光：缓缓循环掠过 ---------- */
.hub-sweep{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.hub-sweep i{
  position:absolute; top:-25%; left:-70%;
  width:46%; height:150%;
  background:linear-gradient(100deg,
    rgba(255,255,255,0)    0%,
    rgba(255,255,255,.90) 38%,
    rgba(206,231,255,.70) 54%,
    rgba(226,214,255,.42) 70%,
    rgba(255,255,255,0)   100%);
  filter:blur(20px);
  opacity:.5;
  animation:sweepMove 12s linear infinite;
}
.hub-sweep i:nth-child(2){ opacity:.34; animation-duration:17s; animation-delay:-5.5s; }
.hub-sweep i:nth-child(3){ opacity:.24; animation-duration:23s; animation-delay:-11s; }
@keyframes sweepMove{
  0%  { transform:translateX(0)     rotate(14deg); }
  100%{ transform:translateX(530%)  rotate(14deg); }
}

/* ---------- 中等大小的五角星闪烁 ---------- */
.hub-stars{ position:absolute; inset:0; pointer-events:none; z-index:1; }
.hub-stars .hstar{
  position:absolute; left:var(--x); top:var(--y);
  width:var(--sz); height:var(--sz);
  color:var(--sc);
  opacity:0;
  animation:starTwinkle var(--dur) ease-in-out infinite;
  animation-delay:var(--dl);
  filter:drop-shadow(0 0 7px currentColor);
}
.hub-stars .hstar svg{ width:100%; height:100%; display:block; }
@keyframes starTwinkle{
  0%   { opacity:.08; transform:scale(.65) rotate(0deg);  }
  42%  { opacity:.95; transform:scale(1.10) rotate(14deg); }
  58%  { opacity:.80; transform:scale(1.02) rotate(12deg); }
  100% { opacity:.08; transform:scale(.65) rotate(0deg);  }
}

/* ---------- 旋转木马（右下角，可点击） ---------- */
.carousel{
  position:absolute; right:clamp(8px,2.6vw,40px); bottom:clamp(6px,2vh,28px);
  width:clamp(112px,15vw,172px); height:clamp(136px,18vw,208px);
  z-index:6; cursor:pointer;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  animation:csFloat 5.4s ease-in-out infinite;
}
.carousel:active{ transform:scale(.97); }
@keyframes csFloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.carousel::after{
  content:""; position:absolute; inset:-10%; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,226,150,.55), transparent 70%);
  opacity:0;
}
.carousel.cs-boost::after{ animation:csFlash .95s var(--ease); }
@keyframes csFlash{ 0%{ opacity:0 } 22%{ opacity:1 } 100%{ opacity:0 } }

.cs-base{
  position:absolute; left:3%; right:3%; bottom:0; height:17%; z-index:1;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 32%, #ffffff 0%, #ffe9f4 46%, #f3c8de 100%);
  border:2px solid #e79ec2;
  box-shadow:0 8px 16px rgba(160,120,150,.28), inset 0 -6px 12px rgba(200,150,180,.28);
}
.cs-pole{
  position:absolute; left:50%; top:14%; bottom:7%; width:6px; margin-left:-3px; z-index:2;
  border-radius:3px;
  background:repeating-linear-gradient(180deg,#ffeaa8 0 8px,#f0c357 8px 16px);
  box-shadow:0 0 9px rgba(224,176,66,.55);
}
.cs-ring{ position:absolute; left:0; right:0; top:27%; bottom:19%; z-index:3; }
.cs-horse{ position:absolute; left:0; top:0; width:36%; will-change:transform; }
.cs-horse svg{ width:100%; height:auto; display:block;
  filter:drop-shadow(0 3px 4px rgba(150,120,170,.28)); }
.cs-roof{ position:absolute; left:1%; right:1%; top:0; height:35%; z-index:5; overflow:visible; }
.cs-bulb{ animation:csBulb 1.7s ease-in-out infinite; }
@keyframes csBulb{ 0%,100%{ opacity:.3 } 50%{ opacity:1 } }

/* ---------- 草莓蛋糕（左下角，点三下吃完再慢慢长回来） ---------- */
.sbcake{
  position:absolute; left:clamp(8px,2.6vw,40px); bottom:clamp(6px,2vh,28px);
  width:clamp(92px,12.5vw,142px); height:auto;
  z-index:6; cursor:pointer;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  transition:transform .4s var(--ease-back);
}
.sbcake svg{ width:100%; height:auto; display:block;
  filter:drop-shadow(0 9px 15px rgba(160,120,150,.3)); }
.sbcake:hover{ transform:translateY(-6px) scale(1.04); }
.sbcake:active{ transform:translateY(-2px) scale(.97); }

.sb-body{ transform-origin:50% 100%;
  transition:opacity .5s var(--ease), transform .75s var(--ease-back); }
.sb-berry{ transform-origin:50% 100%;
  transition:transform .5s var(--ease-back), opacity .45s var(--ease); }
.sbcake.bitten-1 .berry-1,
.sbcake.bitten-2 .berry-2,
.sbcake.bitten-3 .berry-3{
  opacity:0;
  transform:translate(14px,-18px) scale(.12) rotate(75deg);
}
.sbcake.bitten-3 .sb-body{ opacity:0; transform:translateY(12px) scale(.55); }
/* 吃完后：隐隐浮现（半透明轻轻呼吸） */
.sbcake.gone{ pointer-events:none; animation:cakeGhost 1.9s ease-in-out infinite; }
@keyframes cakeGhost{ 0%,100%{ opacity:.14; filter:saturate(.3) } 50%{ opacity:.32; filter:saturate(.5) } }
/* 再生：从模糊中缓缓浮现 */
.sbcake.regrow{ animation:cakeRegrow 1.6s var(--ease-soft) both; }
@keyframes cakeRegrow{
  0%  { opacity:0;   transform:translateY(12px) scale(.62); filter:blur(5px) saturate(.35); }
  45% { opacity:.5;  transform:translateY(0)    scale(1);   filter:blur(2px) saturate(.75); }
  100%{ opacity:1;   transform:none;                        filter:none; }
}
/* 点击时冒出来的小字 */
.sb-float{
  position:absolute; left:50%; top:-8px; transform:translateX(-50%);
  font-family:var(--font-serif); font-size:12px; letter-spacing:.1em;
  color:#e0678f; white-space:nowrap; pointer-events:none;
  text-shadow:0 1px 6px rgba(255,255,255,.9);
  animation:sbFloatUp 1.2s var(--ease-soft) forwards;
}
@keyframes sbFloatUp{
  0%  { opacity:0; transform:translateX(-50%) translateY(6px)  scale(.8); }
  25% { opacity:1; transform:translateX(-50%) translateY(-4px) scale(1);  }
  100%{ opacity:0; transform:translateX(-50%) translateY(-26px) scale(1); }
}

/* ---------- 彩带爆发画布（进入生日页时） ---------- */
#confetti{ position:fixed; inset:0; z-index:80; pointer-events:none; display:block; }

/* ==========================================================================
   6. 页面 3 · 观赏烟花
   —— 唯一保留深色的页面：烟花需要深色夜空才有对比度，
      这里用「暮蓝」而非纯黑，和全站蓝色系保持一致。
   ========================================================================== */
#page3{ background:transparent; }
#fwCanvas{ position:fixed; inset:0; z-index:4; display:block; }
.fw-title{
  position:fixed; z-index:5; left:50%; transform:translateX(-50%);
  bottom:clamp(22px,4vh,44px); margin:0;
  font-family:var(--font-serif); font-size:clamp(12px,1.8vw,15px);
  letter-spacing:.4em; color:rgba(227,240,255,.85); text-align:center;
  text-shadow:0 0 20px rgba(120,170,255,.55);
  pointer-events:none;
  animation:breathe 5s ease-in-out infinite;
}

/* ==========================================================================
   7. 页面 4 · 游戏相册
   ========================================================================== */
/* 注意：这条链路上绝对不能加 filter / opacity，否则会扁平化 3D 上下文，
   翻页动画就失去立体感（透视放在 .book 自己身上，最稳）。 */
.book-stage{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto;
}
.book{
  position:relative;
  width:860px; height:560px;
  flex:0 0 auto;
  display:flex;
  transform-origin:center center;
  transform-style:preserve-3d;
  perspective:2000px;
  transition:opacity .28s var(--ease);
}
/* 手机竖屏：只显示一页（左页），翻页时淡入淡出切换 */
.book.single{ width:420px; }
.book.single .book-right,
.book.single .book-spine{ display:none; }
.book.turning{ opacity:0; }
.book-page{
  flex:0 0 auto;
  width:420px; height:560px; position:relative; overflow:hidden;
  background:linear-gradient(180deg,#fdfdff 0%,#f2f6fc 55%,#e9eff8 100%);
  padding:24px;
  display:flex; flex-direction:column;
}
.book-left{ border-radius:12px 4px 4px 12px;
  box-shadow:0 28px 56px rgba(96,140,190,.32), inset -26px 0 34px -22px rgba(60,90,140,.30); }
.book-right{ border-radius:4px 12px 12px 4px;
  box-shadow:0 28px 56px rgba(96,140,190,.32), inset 26px 0 34px -22px rgba(60,90,140,.30); }
.book-spine{
  flex:0 0 auto;
  width:20px; height:560px; position:relative;
  background:linear-gradient(90deg,#c9d6e8 0%,#e4ecf7 35%,#eef4fb 50%,#e4ecf7 65%,#c9d6e8 100%);
  box-shadow:inset 0 0 12px rgba(70,100,150,.28);
}
.book-spine::after{
  content:""; position:absolute; inset:16px 8px; border-radius:2px;
  background:repeating-linear-gradient(180deg,rgba(120,150,195,.18) 0 2px,transparent 2px 12px);
}
.grid{
  flex:1; min-height:0; min-width:0;
  /* 3 × 3 = 每页 9 张（左右两页共 18 张 = 一个跨页） */
  /* 关键：用 minmax(0,1fr) 而不是 1fr —— 1fr 的实际最小值是 auto，
     会被图片自身宽高比撑大，导致整页溢出、图片被挤出去；
     minmax(0,1fr) 强制九个格子永远等分，与图片内容无关 */
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr));
  gap:14px;
}
.photo-cell{
  position:relative; border-radius:6px; overflow:hidden;
  min-width:0; min-height:0;      /* 允许格子被压缩到任意小，绝不撑破网格 */
  background:#fff;
  box-shadow:0 3px 10px rgba(60,90,140,.16), 0 0 0 4px #fff, 0 0 0 5px rgba(160,185,215,.55);
  transition:transform .45s var(--ease-back), box-shadow .45s var(--ease);
}
.photo-cell img{
  /* 绝对定位：图片不再参与布局计算，无论原图多大比例都只填充格子并被裁切 */
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:cover; cursor:zoom-in;
  transition:transform .6s var(--ease-soft), filter .4s var(--ease);
  background:#eef3fa;
}
.photo-cell:hover{ transform:translateY(-3px) scale(1.045); z-index:2;
  box-shadow:0 12px 26px rgba(60,90,140,.28), 0 0 0 4px #fff, 0 0 0 5px rgba(150,180,215,.78); }
.photo-cell:hover img{ transform:scale(1.06); }
.photo-cell.empty{
  background:rgba(233,240,250,.55);
  box-shadow:none;
  border:1.5px dashed rgba(150,175,210,.75);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  color:#8fa6c4;
}
.photo-cell.empty svg{ width:26px; height:26px; opacity:.7; }
.photo-cell.empty span{ font-size:10.5px; letter-spacing:.2em; }
.photo-cell.empty:hover{ transform:none;
  border-color:rgba(120,155,200,.9);
  background:rgba(233,240,250,.8); }

/* 翻页层 */
.flip-layer{
  position:absolute; top:0; width:420px; height:560px;
  transform-style:preserve-3d;
  transition:transform .78s cubic-bezier(.32,.02,.24,1);
  will-change:transform;
  z-index:6;
}
.flip-layer.flip-next{ left:440px; transform-origin:left center; }
.flip-layer.flip-prev{ left:0;    transform-origin:right center; }
.flip-face{
  position:absolute; inset:0; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:linear-gradient(180deg,#fdfdff 0%,#f2f6fc 55%,#e9eff8 100%);
  padding:24px; display:flex; flex-direction:column;
}
.flip-front{ border-radius:4px 10px 10px 4px; }
.flip-back { border-radius:10px 4px 4px 10px; transform:rotateY(180deg); }

/* 翻页按钮 */
.nav-btn{
  position:absolute; top:50%; transform:translateY(-50%);
  width:46px; height:46px; border-radius:50%;
  display:grid; place-items:center; z-index:20;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  color:var(--blue-deep); font-size:24px; line-height:1;
  box-shadow:0 10px 26px rgba(96,140,190,.28);
  transition:transform .35s var(--ease-back), background .3s var(--ease), color .3s var(--ease), opacity .3s var(--ease);
}
.nav-btn:hover:not(:disabled){ background:#6ea3d8; color:#fff; transform:translateY(-50%) scale(1.1); }
.nav-btn:active:not(:disabled){ transform:translateY(-50%) scale(.94); }
.nav-btn:disabled{ opacity:.22; cursor:not-allowed; }
.nav-prev{ left:-14px; }
.nav-next{ right:-14px; }
.album-foot{
  margin-top:clamp(16px,3vw,26px);
  display:flex; align-items:center; gap:16px;
  font-size:12px; letter-spacing:.28em; color:var(--muted);
}
.album-foot .dot{ width:5px; height:5px; border-radius:50%; background:rgba(111,163,214,.55); }

/* ==========================================================================
   7.5 相册四周的装饰
   —— 蜿蜒的绿色枝丫 + 粉色摇摆花朵 + 树叶
       右上角四叶草 / 左下角浅粉雨伞（都不遮挡照片）
       整页飘落的花瓣与树叶
   ========================================================================== */
/* 花瓣 / 树叶飘落画布：铺满整个相册页，不拦点击。
   注意：canvas 是「替换元素」，必须显式写 width/height，
   否则浏览器会按 canvas 自身的 300×150 默认尺寸排版，
   画布就会缩在左上角那一小块（肉眼只看到角落里飘）。 */
#petalCanvas{
  position:fixed; inset:0;
  width:100%; height:100%;
  z-index:6; pointer-events:none; display:block;
}
.album-scene{
  position:relative; width:100%;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- 蜿蜒枝丫 ---------- */
.vine{ position:absolute; pointer-events:none; z-index:3; }
.vine-stem{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.vine-stem path{ fill:none; stroke-linecap:round; vector-effect:non-scaling-stroke; }
.vine-stem .v-base{ stroke:#6fb35e; stroke-width:4.4; }
.vine-stem .v-hi{   stroke:#a8dd92; stroke-width:1.9; opacity:.95; }
/* 位置刻意往外挪：藤蔓与花朵最多只压到相册的白边（页内边距 24px）为止，
   绝不会盖到照片本身。 */
.vine-top   { left:-36px; right:-36px; top:-46px;    height:64px; }
.vine-bottom{ left:-36px; right:-36px; bottom:-46px; height:64px; }
.vine-left  { top:-26px; bottom:-26px; left:-48px;   width:64px; }
.vine-right { top:-26px; bottom:-26px; right:-48px;  width:64px; }

/* ---------- 花朵与树叶（由 JS 生成） ---------- */
.bloom{
  position:absolute; pointer-events:none;
  transform:translate(-50%,-50%);
  transform-origin:50% 100%;
  animation:bloomSway 4.2s ease-in-out infinite;
  animation-delay:var(--d,0s);
}
.bloom svg{ width:100%; height:100%; display:block;
  filter:drop-shadow(0 2px 4px rgba(180,120,150,.30)); }
@keyframes bloomSway{
  0%,100%{ transform:translate(-50%,-50%) rotate(-8deg)   scale(1); }
  50%    { transform:translate(-50%,-50%) rotate(8deg)    scale(1.08); }
}
.leaf{
  position:absolute; pointer-events:none;
  transform:translate(-50%,-50%);
  transform-origin:50% 100%;
  animation:leafSway 5.2s ease-in-out infinite;
  animation-delay:var(--d,0s);
  opacity:.95;
}
.leaf svg{ width:100%; height:100%; display:block;
  filter:drop-shadow(0 1px 3px rgba(90,140,80,.28)); }
@keyframes leafSway{
  0%,100%{ transform:translate(-50%,-50%) rotate(-11deg); }
  50%    { transform:translate(-50%,-50%) rotate(11deg);  }
}

/* ---------- 角落别着的装饰：四叶草（右上）/ 雨伞（左下） ----------
   --sz 是装饰尺寸，--op 是允许压进相册白边的像素（小于页内边距 24px，
   所以永远不会盖到照片）。 */
.album-deco{ position:absolute; pointer-events:none; z-index:5; }
.album-deco svg{ width:100%; height:100%; display:block; }
.deco-clover{
  --sz:clamp(58px,7.4vw,118px); --op:20px;
  width:var(--sz); height:var(--sz);
  top:calc(var(--op) - var(--sz)); right:calc(var(--op) - var(--sz));
  animation:decoSway 5.4s ease-in-out infinite;
  filter:drop-shadow(0 4px 10px rgba(90,150,80,.30));
}
.deco-umbrella{
  --sz:clamp(64px,8vw,128px); --op:20px;
  width:var(--sz); height:var(--sz);
  bottom:calc(var(--op) - var(--sz)); left:calc(var(--op) - var(--sz));
  animation:umbSway 6.2s ease-in-out infinite;
  transform-origin:50% 92%;
  filter:drop-shadow(0 4px 10px rgba(170,120,145,.30));
}
@keyframes decoSway{
  0%,100%{ transform:rotate(-6deg) translateY(0);    }
  50%    { transform:rotate(6deg)  translateY(-5px); }
}
@keyframes umbSway{
  0%,100%{ transform:rotate(-5deg); }
  50%    { transform:rotate(5deg);  }
}

/* 大图 lightbox */
.lightbox{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(16px,4vw,56px);
  background:rgba(224,236,250,.82);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:0; visibility:hidden;
  transition:opacity .42s var(--ease), visibility 0s linear .42s;
}
.lightbox.show{ opacity:1; visibility:visible; transition:opacity .42s var(--ease), visibility 0s linear 0s; }
.lightbox img{
  max-width:100%; max-height:100%;
  border-radius:10px;
  box-shadow:0 30px 70px rgba(96,140,190,.45), 0 0 0 6px rgba(255,255,255,.9);
  transform:scale(.94); transition:transform .45s var(--ease-back);
}
.lightbox.show img{ transform:scale(1); }
.lightbox-close{
  position:absolute; top:clamp(14px,3vw,26px); right:clamp(14px,3vw,26px);
  width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; font-size:22px; line-height:1;
  color:var(--blue-deep); background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 20px rgba(96,140,190,.25);
  transition:transform .35s var(--ease-back), background .3s var(--ease);
}
.lightbox-close:hover{ transform:rotate(90deg) scale(1.06); background:#6ea3d8; color:#fff; }

/* ==========================================================================
   8. 页面 5 · 时光机
   ========================================================================== */
.tm-section{ width:100%; max-width:900px; margin:0 auto; }
.tm-heading{
  font-family:var(--font-serif); font-weight:500;
  font-size:clamp(16px,2.4vw,21px); letter-spacing:.24em;
  color:var(--ice); margin:0 0 4px;
  display:flex; align-items:center; gap:14px;
}
.tm-heading::before{
  content:""; width:22px; height:1px; background:linear-gradient(90deg,transparent,rgba(190,220,255,.8));
}
.tm-heading::after{
  content:""; flex:1; height:1px;
  background:linear-gradient(90deg,rgba(190,220,255,.35),transparent);
}
.tm-sub{ font-size:11.5px; letter-spacing:.24em; color:var(--muted); margin:0 0 22px; }

/* --- 时间轴 --- */
.timeline{ position:relative; padding-left:34px; margin-bottom:clamp(40px,8vw,72px); }
.timeline::before{
  content:""; position:absolute; left:9px; top:8px; bottom:8px; width:1px;
  background:linear-gradient(180deg,transparent,rgba(126,172,220,.85) 8%,rgba(126,172,220,.7) 88%,transparent);
}
.tl-node{ position:relative; margin-bottom:22px; }
.tl-dot{
  position:absolute; left:-34px; top:16px;
  width:19px; height:19px; border-radius:50%;
  display:grid; place-items:center;
  background:#ffffff;
  border:1px solid rgba(126,172,220,.85);
  box-shadow:0 4px 12px rgba(122,163,210,.25);
}
.tl-dot::after{
  content:""; width:7px; height:7px; border-radius:50%;
  background:var(--ice); box-shadow:0 0 12px rgba(66,118,173,.6);
}
.tl-card{
  padding:15px 20px; border-radius:16px;
  background:var(--glass-bg); border:1px solid var(--glass-line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:transform .5s var(--ease-back), border-color .4s var(--ease), box-shadow .4s var(--ease);
}
.tl-card:hover{ transform:translateX(5px); border-color:rgba(255,255,255,.95);
  box-shadow:0 14px 32px rgba(122,163,210,.26), 0 0 24px rgba(255,255,255,.7); }
.tl-date{ font-size:12px; letter-spacing:.24em; color:var(--ice); margin-bottom:5px; }
.tl-name{ font-family:var(--font-serif); font-size:clamp(14px,2vw,17px); letter-spacing:.16em; color:var(--ink); }
.tl-desc{ font-size:12px; letter-spacing:.08em; color:var(--muted); margin-top:6px; line-height:1.7; }
.tl-node.ellipsis .tl-card{
  background:rgba(255,255,255,.35); border-style:dashed; border-color:rgba(126,172,220,.55);
  padding:8px 20px;
}
.tl-node.ellipsis .tl-dots{ letter-spacing:.6em; color:rgba(66,118,173,.55); font-size:15px; }
/* 滚动进入动画：滚到哪亮到哪 */
.reveal{ opacity:0; transform:translateY(26px); transition:opacity .8s var(--ease-soft), transform .8s var(--ease-soft); }
.reveal.show{ opacity:1; transform:none; }
.tl-node.reveal.show .tl-dot{ animation:dotPop .7s var(--ease-back); }
@keyframes dotPop{
  0%{ transform:scale(.4); }
  60%{ transform:scale(1.25); }
  100%{ transform:scale(1); }
}
.days-card{
  display:inline-flex; align-items:baseline; gap:9px;
  margin:0 0 18px; padding:13px 24px; border-radius:100px;
  background:var(--glass-bg-2); border:1px solid var(--glass-line);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 28px rgba(96,140,190,.22);
}
.days-num{
  font-family:var(--font-serif); font-size:clamp(22px,3.6vw,30px); font-weight:600;
  background:linear-gradient(180deg,#2b5586,#6fa3d6);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 10px rgba(255,255,255,.9));
}
.days-label{ font-size:12px; letter-spacing:.26em; color:var(--ink-soft); }

/* --- 祝福墙 --- */
.note-wall{
  display:flex; flex-wrap:wrap; gap:clamp(12px,2vw,20px);
  justify-content:center; margin-bottom:clamp(40px,8vw,72px);
  padding:10px 0;
}
.note{
  width:clamp(140px,20vw,182px); min-height:clamp(120px,16vw,148px);
  padding:18px 16px;
  border-radius:4px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-serif);
  font-size:clamp(12px,1.5vw,14px); line-height:1.9; letter-spacing:.08em;
  color:#3d5570;
  box-shadow:0 10px 24px rgba(96,140,190,.22), 0 0 0 1px rgba(255,255,255,.75), inset 0 1px 0 rgba(255,255,255,.85);
  transition:transform .5s var(--ease-back), box-shadow .5s var(--ease);
  position:relative;
}
.note::after{ /* 纸张质感：细微纹理与折角阴影 */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:
    linear-gradient(135deg,rgba(255,255,255,.5) 0%,transparent 42%),
    radial-gradient(120% 90% at 100% 100%, rgba(120,150,190,.16), transparent 60%);
}
.note:hover{ transform:translateY(-9px) rotate(0deg) scale(1.035); box-shadow:0 20px 40px rgba(96,140,190,.34), 0 0 0 1px rgba(255,255,255,.9); z-index:3; }
/* 便签色：浅蓝 / 米白 / 淡灰蓝（比背景略深一点，才有贴纸层次） */
.note-0{ background:linear-gradient(165deg,#dcebff,#c2dbf7); }
.note-1{ background:linear-gradient(165deg,#f9f7f1,#ebe6d9); }
.note-2{ background:linear-gradient(165deg,#dee9f7,#c6d7ec); }
.note-3{ background:linear-gradient(165deg,#ebf0fa,#d3e0f2); }
.note-4{ background:linear-gradient(165deg,#eaeff7,#d2d9ea); }
.note-5{ background:linear-gradient(165deg,#e4f2ff,#cde6fb); }

/* --- 许愿墙 --- */
.wish-composer{
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  padding:16px; border-radius:20px; width:100%;
}
.wish-input{
  flex:1 1 240px; min-width:0;
  padding:13px 18px; border-radius:14px;
  font-size:14px; letter-spacing:.06em; color:var(--ink);
  background:rgba(255,255,255,.75);
  border:1px solid rgba(172,203,234,.8); outline:none;
  transition:border-color .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
}
.wish-input::placeholder{ color:var(--muted); letter-spacing:.18em; font-size:13px; }
.wish-input:focus{ border-color:rgba(111,163,214,.95); background:rgba(255,255,255,.95);
  box-shadow:0 0 0 4px rgba(140,190,255,.22); }
.wish-actions{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px; }
.wish-tip{ font-size:11px; letter-spacing:.2em; color:var(--muted); }

/* 许愿泡泡 */
.wish-bubble{
  position:fixed; z-index:9000; pointer-events:none;
  width:150px; height:150px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:22px;
  font-family:var(--font-serif); font-size:12.5px; line-height:1.75; letter-spacing:.06em;
  color:#2f5c8f;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.55) 18%, transparent 44%),
    radial-gradient(circle at 72% 78%, rgba(169,154,224,.34), transparent 56%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.60) 0%, rgba(208,230,251,.62) 58%, rgba(180,213,245,.78) 100%);
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  box-shadow:0 12px 30px rgba(96,140,190,.34), inset 0 0 24px rgba(255,255,255,.65);
  opacity:0;
  will-change:transform,opacity;
}
/* 泡泡高光 */
.wish-bubble::after{
  content:""; position:absolute; left:22%; top:14%;
  width:26px; height:18px; border-radius:50%;
  background:rgba(255,255,255,.95); filter:blur(2.5px); transform:rotate(-25deg);
}

/* 历史许愿模态框 */
.modal{
  position:fixed; inset:0; z-index:300;
  display:flex; align-items:center; justify-content:center; padding:20px;
  background:rgba(214,232,248,.62);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  opacity:0; visibility:hidden;
  transition:opacity .4s var(--ease), visibility 0s linear .4s;
}
.modal.show{ opacity:1; visibility:visible; transition:opacity .4s var(--ease), visibility 0s linear 0s; }
.modal-box{
  width:min(480px,92vw); max-height:min(76vh,620px);
  border-radius:24px; padding:26px 24px 20px;
  display:flex; flex-direction:column;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 30px 70px rgba(96,140,190,.30), inset 0 1px 0 rgba(255,255,255,.95);
  transform:translateY(20px) scale(.97);
  transition:transform .45s var(--ease-back);
}
.modal.show .modal-box{ transform:none; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.modal-title{ font-family:var(--font-serif); font-size:17px; letter-spacing:.24em; color:var(--ice); margin:0; }
.modal-close{
  width:34px; height:34px; border-radius:50%; font-size:19px; line-height:1;
  display:grid; place-items:center; color:var(--ink-soft);
  background:rgba(255,255,255,.6); border:1px solid rgba(172,203,234,.8);
  transition:transform .35s var(--ease-back), background .3s var(--ease);
}
.modal-close:hover{ transform:rotate(90deg); background:rgba(110,163,216,.18); }
.modal-count{ font-size:11px; letter-spacing:.22em; color:var(--muted); margin:0 0 16px; }
.wish-list{ overflow-y:auto; flex:1; padding-right:6px; display:flex; flex-direction:column; gap:11px; }
.wish-item{
  padding:13px 16px; border-radius:14px;
  background:rgba(255,255,255,.68); border:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 16px rgba(122,163,210,.14);
  display:flex; gap:12px; align-items:flex-start;
  animation:fadeUp .5s var(--ease-soft) both;
}
.wish-item .idx{
  flex:0 0 auto; min-width:22px; height:22px; padding:0 6px; border-radius:8px;
  display:grid; place-items:center;
  font-size:10.5px; color:var(--blue-deep);
  background:rgba(111,163,214,.16); border:1px solid rgba(111,163,214,.3);
}
.wish-item .body{ flex:1; min-width:0; }
.wish-item .txt{ font-size:13.5px; line-height:1.75; letter-spacing:.05em; color:var(--ink); word-break:break-word; }
.wish-item .time{ font-size:10.5px; letter-spacing:.16em; color:var(--muted); margin-top:5px; }
.empty-tip{ text-align:center; color:var(--muted); font-size:12.5px; letter-spacing:.2em; padding:38px 10px; }

/* ==========================================================================
   9. 响应式
   ========================================================================== */
/* 秘密基地：底部给木马和蛋糕留出空间，避免和卡片重叠 */
#page2 .page-inner{ padding-bottom:clamp(150px,26vh,230px); }

@media (max-width:860px){
  .hub-grid{ flex-direction:column; align-items:center; }
  .carousel{ width:104px; height:126px; right:6px; bottom:6px; }
  .sbcake{ width:88px; left:6px; bottom:6px; }
  .hub-stars .hstar{ filter:drop-shadow(0 0 5px currentColor); }
  .hub-card{ width:min(340px,86vw); max-width:none; min-height:150px; flex-direction:row; justify-content:flex-start;
    padding:22px 24px; gap:18px; }
  .hub-card .hub-text{ text-align:left; }
  .nav-prev{ left:-6px; }
  .nav-next{ right:-6px; }
  .nav-btn{ width:40px; height:40px; font-size:20px; }
}
@media (max-width:560px){
  .page-inner{ padding:76px 16px 28px; }
  .gate-box{ padding:28px 22px; }
  .note{ width:calc(50% - 10px); min-height:122px; }
  .timeline{ padding-left:30px; }
  .modal-box{ padding:22px 18px 16px; }
  .wish-bubble{ width:124px; height:124px; padding:18px; font-size:11.5px; }
  .album-foot{ font-size:11px; letter-spacing:.2em; }
}
/* 手机端：角落装饰与枝丫同比缩小，避免被屏幕边缘裁掉 */
@media (max-width:760px){
  .deco-clover   { --sz:clamp(44px,11.5vw,58px);  --op:11px; }
  .deco-umbrella { --sz:clamp(48px,12.5vw,64px);  --op:11px; }
  .vine-top   { top:-36px;    height:46px; left:-26px; right:-26px; }
  .vine-bottom{ bottom:-36px; height:46px; left:-26px; right:-26px; }
  .vine-left  { left:-38px;  width:46px; }
  .vine-right { right:-38px; width:46px; }
}
@media (hover:none){
  .hub-card:hover{ transform:none; }
  .photo-cell:hover{ transform:none; }
  .note:hover{ transform:translateY(-4px) scale(1.01); }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div id="app">

  <!-- ==================================================================
       页面 0 · 密码门

  <section class="page active" id="page0">
    <div class="page-inner">
      <div class="gate-box glass">

      <div class="cake-wrap">
        <p class="cake-hint-top">请许个愿望吹灭蜡烛吧！</p>

        <!-- 纯 SVG 手绘蛋糕（浅蓝色系 / 不使用任何网图） -->
        <svg id="cakeSvg" class="cake-svg" viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="生日蛋糕">
          <defs>
            <linearGradient id="gPlate" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f2f8ff"/><stop offset="100%" stop-color="#bfd2e6"/>
            </linearGradient>
            <linearGradient id="gL1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#dcecfd"/><stop offset="55%" stop-color="#bcd8f4"/><stop offset="100%" stop-color="#9dc0e4"/>
            </linearGradient>
            <linearGradient id="gL2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e6f2ff"/><stop offset="55%" stop-color="#c9e0f8"/><stop offset="100%" stop-color="#a9c9ea"/>
            </linearGradient>
            <linearGradient id="gL3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#eef6ff"/><stop offset="55%" stop-color="#d3e7fb"/><stop offset="100%" stop-color="#b3d2ef"/>
            </linearGradient>
            <linearGradient id="gFrost" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#f2f9ff"/><stop offset="100%" stop-color="#d8e9fb"/>
            </linearGradient>
            <radialGradient id="gTop" cx="38%" cy="28%" r="80%">
              <stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#e2effc"/><stop offset="100%" stop-color="#b6cfeb"/>
            </radialGradient>
            <linearGradient id="gCandle" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d5e6f8"/>
            </linearGradient>
            <radialGradient id="gFlame" cx="50%" cy="72%" r="70%">

            </radialGradient>
            <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,206,120,.55)"/><stop offset="55%" stop-color="rgba(255,180,90,.18)"/><stop offset="100%" stop-color="rgba(255,180,90,0)"/>
            </radialGradient>
            <filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="6"/>

          </defs>

          <!-- 地面阴影 + 盘子 -->
          <ellipse cx="170" cy="303" rx="118" ry="13" fill="rgba(60,110,180,.26)" filter="url(#fSoft)"/>
          <ellipse cx="170" cy="300" rx="132" ry="16" fill="url(#gPlate)"/>
          <ellipse cx="170" cy="297" rx="126" ry="14" fill="rgba(255,255,255,.55)"/>

          <!-- 第一层（底层） -->
          <rect x="38" y="236" width="264" height="60" rx="14" fill="url(#gL1)"/>
          <rect x="52" y="246" width="18" height="40" rx="9" fill="rgba(255,255,255,.34)"/>
          <rect x="38" y="222" width="264" height="20" rx="10" fill="url(#gFrost)"/>
          <g fill="url(#gFrost)">
            <circle cx="51" cy="240" r="12"/><circle cx="75" cy="240" r="12"/><circle cx="99" cy="240" r="12"/>
            <circle cx="122" cy="240" r="12"/><circle cx="146" cy="240" r="12"/><circle cx="170" cy="240" r="12"/>
            <circle cx="194" cy="240" r="12"/><circle cx="218" cy="240" r="12"/><circle cx="241" cy="240" r="12"/>
            <circle cx="265" cy="240" r="12"/><circle cx="289" cy="240" r="12"/>

/* ============================================================================

/* ---------------------------------------------------------------------------
 * 工具函数
 * -------------------------------------------------------------------------*/
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

/* 元素是否已在视口内（用于懒启动动画） */
function on(el, ev, fn, opt){ if(el) el.addEventListener(ev, fn, opt); }

/* ---------------------------------------------------------------------------
 * 背景漂浮光点层（Canvas，全站固定）
 * 浅色韩系 ins 风：柔焦光斑 + 细碎闪点，缓慢呼吸与漂移
 * -------------------------------------------------------------------------*/
const Starfield = (function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, stars = [], orbs = [], glints = [], raf = 0, lastT = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function build(){
    // 数量随屏幕面积自适应，手机上自动减少以保证流畅
    const area = W * H;
    const sparkCount = Math.round(Math.min(240, Math.max(70, area / 8200)));
    const orbCount   = Math.round(Math.min(20,  Math.max(8,  area / 78000)));
    const glintCount = Math.round(Math.min(30,  Math.max(9,  area / 58000)));
    stars = []; orbs = []; glints = [];

    // ---- 细碎闪点（会流动）：白色为主，少量冰蓝 / 浅紫点缀 ----
    for(let i = 0; i < sparkCount; i++){
      const r = Math.random();
      const flowing = Math.random() < 0.55;         // 大部分闪点会缓慢流动
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.5 + Math.random() * 1.45,
        base: 0.34 + Math.random() * 0.40,          // 基础亮度
        amp: 0.22 + Math.random() * 0.48,           // 闪烁幅度
        phase: Math.random() * Math.PI * 2,
        speed: 0.0005 + Math.random() * 0.0018,     // 每颗周期都不同
        // 流动：横向漂移 + 向上飘，速度各不相同
        vx: flowing ? (Math.random() * 0.038 + 0.010) * (Math.random() < 0.5 ? -1 : 1) : 0,
        vy: flowing ? -(Math.random() * 0.030 + 0.008) : 0,
        sway: flowing ? (0.004 + Math.random() * 0.012) : 0,   // 左右摇摆，形成流动感
        tint: r < 0.16 ? '169,154,224' : (r < 0.42 ? '120,175,225' : '255,255,255'),
        halo: r > 0.90                              // 少量带光晕的亮点
      });
    }

    // ---- 流动的四角星细闪 ✦ ----
    for(let i = 0; i < glintCount; i++){
      const r = Math.random();
      glints.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 3 + Math.random() * 5.5,
        phase: Math.random() * Math.PI * 2,
        speed: 0.0008 + Math.random() * 0.0020,
        vx: (Math.random() * 0.030 + 0.006) * (Math.random() < 0.5 ? -1 : 1),
        vy: -(Math.random() * 0.026 + 0.005),
        tint: r < 0.34 ? '255,255,255' : (r < 0.68 ? '186,219,252' : '214,196,250')
      });
    }

    // ---- 柔焦光斑（韩系 ins 的散景感） ----
    for(let i = 0; i < orbCount; i++){
      orbs.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 16 + Math.random() * 56,
        a: 0.10 + Math.random() * 0.28,
        phase: Math.random() * Math.PI * 2,
        speed: 0.00025 + Math.random() * 0.0006,
        vx: (Math.random() * 0.012 + 0.003) * (Math.random() < 0.5 ? -1 : 1),
        vy: -(Math.random() * 0.010 + 0.002),
        tint: Math.random() < 0.32 ? '206,190,246' : (Math.random() < 0.5 ? '186,215,245' : '255,255,255')
      });
    }
  }

  function draw(t){
    if(!lastT) lastT = t;
    const dt = Math.min(48, t - lastT); lastT = t;
    ctx.clearRect(0, 0, W, H);

    // ---- 柔焦光斑：极缓慢漂移 + 呼吸 ----
    for(let i = 0; i < orbs.length; i++){
      const o = orbs[i];
      o.x += o.vx * dt * 0.06;
      o.y += o.vy * dt * 0.06;
      if(o.x < -o.r) o.x = W + o.r; else if(o.x > W + o.r) o.x = -o.r;
      if(o.y < -o.r) o.y = H + o.r; else if(o.y > H + o.r) o.y = -o.r;
      const a = o.a + Math.sin(t * o.speed + o.phase) * 0.06;
      if(a <= 0.01) continue;
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      g.addColorStop(0, 'rgba(' + o.tint + ',' + a.toFixed(3) + ')');
      g.addColorStop(0.55, 'rgba(' + o.tint + ',' + (a * 0.35).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + o.tint + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, 6.2832);
      ctx.fill();
    }

    // ---- 流动的四角星细闪 ✦ ----
    for(let i = 0; i < glints.length; i++){
      const g = glints[i];
      g.x += g.vx * dt * 0.06;
      g.y += g.vy * dt * 0.06;
      if(g.x < -20) g.x = W + 20; else if(g.x > W + 20) g.x = -20;
      if(g.y < -20) g.y = H + 20; else if(g.y > H + 20) g.y = -20;

      const tw = Math.sin(t * g.speed + g.phase);
      let a = 0.32 + tw * 0.34;
      if(a < 0.04) continue;
      const rr = g.r * (0.72 + 0.34 * (tw * 0.5 + 0.5));

      // 柔光
      const gg = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, rr * 2.6);
      gg.addColorStop(0, 'rgba(' + g.tint + ',' + (a * 0.42).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(' + g.tint + ',0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(g.x, g.y, rr * 2.6, 0, 6.2832); ctx.fill();

      // 四角星本体
      ctx.beginPath();
      ctx.moveTo(g.x, g.y - rr);
      ctx.quadraticCurveTo(g.x, g.y, g.x + rr, g.y);
      ctx.quadraticCurveTo(g.x, g.y, g.x, g.y + rr);
      ctx.quadraticCurveTo(g.x, g.y, g.x - rr, g.y);
      ctx.quadraticCurveTo(g.x, g.y, g.x, g.y - rr);
      ctx.closePath();
      ctx.fillStyle = 'rgba(' + g.tint + ',' + a.toFixed(3) + ')';
      ctx.fill();
    }

    // ---- 细碎闪点：不同延迟、不同周期的闪烁 + 流动 ----
    for(let i = 0; i < stars.length; i++){
      const s = stars[i];
      const tw = Math.sin(t * s.speed + s.phase);
      let a = s.base + s.amp * tw;
      if(a < 0.03) a = 0.03;
      if(a > 1) a = 1;

      if(s.vx || s.vy || s.sway){
        // 叠加一个横向摇摆分量，让流动轨迹呈波浪感而不是直线
        const sway = s.sway ? Math.cos(t * 0.0009 + s.phase) * s.sway * 0.6 : 0;
        s.x += (s.vx + sway) * dt * 0.06;
        s.y += s.vy * dt * 0.06;
        if(s.x < -6) s.x = W + 6; else if(s.x > W + 6) s.x = -6;
        if(s.y < -6) s.y = H + 6; else if(s.y > H + 6) s.y = -6;
      }

      // 亮点：柔和外发光
      if(s.halo){
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 7);
        g.addColorStop(0, 'rgba(' + s.tint + ',' + (a * 0.30).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(' + s.tint + ',0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 7, 0, 6.2832);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + s.tint + ',' + a.toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  function start(){ if(!raf) raf = requestAnimationFrame(draw); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = 0; lastT = 0; } }

  window.addEventListener('resize', resize, { passive:true });
  window.addEventListener('orientationchange', () => setTimeout(resize, 260));
  resize();
  start();

  return { resize: resize, start: start, stop: stop };
})();

const Floaties = (function(){
  const layer = document.getElementById('floaties');
  let lastW = window.innerWidth;

  function build(){
    if(!layer) return;
    layer.innerHTML = '';
    const narrow = window.innerWidth < 760;

    // ===== 【想调整漂浮元素的种类与数量，改这里】 =====
    // 卡通玉米 + 5 种甜品（纸杯蛋糕 / 甜甜圈 / 冰淇淋 / 马卡龙 / 布丁）
    const plan = [];
    const kinds = ['corn','cupcake','donut','icecream','macaron','pudding'];
    kinds.forEach(function(k){
      const n = k === 'corn' ? (narrow ? 3 : 3) : (narrow ? 1 : 2);
      for(let j = 0; j < n; j++) plan.push(k);
    });
    const items = narrow ? plan.slice(0, 9) : plan;   // 手机端少放一些，省性能

    items.forEach(function(kind){
      const el = document.createElement('div');
      el.className = 'floaty';
      const size   = 30 + Math.random() * 34;          // 30 ~ 64 px
      const dx     = 8 + Math.random() * 22;
      const dy     = 18 + Math.random() * 26;
      const dur    = 15 + Math.random() * 13;
      const dur2   = 9 + Math.random() * 10;
      const r0     = (Math.random() * 26 - 13).toFixed(1);
      const r1     = (Math.random() * 30 - 15).toFixed(1);

      el.style.left   = (2 + Math.random() * 90).toFixed(2) + '%';
      el.style.top    = (4 + Math.random() * 84).toFixed(2) + '%';
      el.style.width  = size.toFixed(0) + 'px';
      el.style.height = size.toFixed(0) + 'px';
      el.style.opacity = (0.28 + Math.random() * 0.34).toFixed(2);
      el.style.setProperty('--dx', dx.toFixed(1) + 'px');
      el.style.setProperty('--dy', dy.toFixed(1) + 'px');
      el.style.setProperty('--r0', r0 + 'deg');
      el.style.setProperty('--r1', r1 + 'deg');
      el.style.animationDuration = dur.toFixed(1) + 's';
      el.style.animationDelay = (-Math.random() * dur).toFixed(1) + 's';

      const inner = document.createElement('div');
      inner.className = 'floaty-in';
      inner.style.animationDuration = dur2.toFixed(1) + 's';
      inner.style.animationDelay = (-Math.random() * dur2).toFixed(1) + 's';
      inner.innerHTML = FLOAT_ART[kind] || '';

      el.appendChild(inner);
      layer.appendChild(el);
    });
  }

  // 只在宽度变化明显 / 横竖屏切换时重建，避免手机滚动时地址栏变化导致闪烁
  function maybeRebuild(){
    if(Math.abs(window.innerWidth - lastW) > 140){
      lastW = window.innerWidth;
      build();
    }
  }
  window.addEventListener('resize', maybeRebuild, { passive:true });
  window.addEventListener('orientationchange', function(){ setTimeout(build, 300); });

  build();
  return { build: build };
})();


/* ---------------------------------------------------------------------------
 * 彩带爆发：密码正确进入「生日快乐」页时，从屏幕中心向四处散开再慢慢消失
 * —— 纯 Canvas，放完自动停掉 rAF，不常驻占用性能
 * -------------------------------------------------------------------------*/
const Confetti = (function(){
  const canvas = document.getElementById('confetti');
  if(!canvas || !canvas.getContext) return { burst:function(){}, resize:function(){} };
  const ctx = canvas.getContext('2d');

  // ===== 【想换彩带的颜色，改这里】 =====
  const COLORS = ['#ff7fa8','#ffd166','#7fd8a6','#7fb8ff','#c6a8ff',
                  '#ff9ec4','#8fe3ff','#ffe08a','#ffb37f','#a8e6cf','#ffffff'];

  let W = 0, H = 0, DPR = 1, parts = [], raf = 0, last = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', function(){
    resize();
    if(parts.length) ctx.clearRect(0, 0, W, H);
  }, { passive:true });

  function burst(){
    const n = (W < 700) ? 110 : 175;
    const cx = W / 2, cy = H * 0.45;
    parts = [];
    for(let i = 0; i < n; i++){
      const a  = Math.random() * Math.PI * 2;
      const sp = 3.0 + Math.random() * 10.5;
      parts.push({
        x: cx + (Math.random() - .5) * 46,
        y: cy + (Math.random() - .5) * 26,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 2.6,          // 先往上冲一点，再被重力拉下来
        w:  4 + Math.random() * 6,
        h:  8 + Math.random() * 11,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - .5) * 0.30,
        spin: Math.random() * Math.PI * 2,
        vs: 0.07 + Math.random() * 0.17,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 0,
        max: 1500 + Math.random() * 1500,
        delay: Math.random() * 260
      });
    }
    if(!raf){ last = 0; raf = requestAnimationFrame(frame); }
  }

  function drawRibbon(p, a){
    // 用横向缩放模拟彩带在空中翻面
    const flip = Math.cos(p.spin);
    const w = p.w * (0.22 + Math.abs(flip) * 0.78);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-w / 2, -p.h / 2, w, p.h);
    if(flip > 0){                              // 正面加一道高光，更有质感
      ctx.fillStyle = 'rgba(255,255,255,.38)';
      ctx.fillRect(-w / 2, -p.h / 2, w * 0.32, p.h);
    }
    ctx.restore();
  }

  function frame(t){
    if(!last) last = t;
    const dt = Math.min(42, t - last); last = t;
    const k = dt / 16.67;                      // 归一化到 60fps 的步长
    ctx.clearRect(0, 0, W, H);
    let alive = 0;

    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      if(p.delay > 0){ p.delay -= dt; alive++; continue; }
      p.life += dt;

      p.vx *= Math.pow(0.982, k);
      p.vy *= Math.pow(0.982, k);
      p.vy += 0.135 * k;                       // 重力
      p.x  += p.vx * k;
      p.y  += p.vy * k;
      p.rot  += p.vr * k * 0.35;
      p.spin += p.vs * k;
      p.x  += Math.sin(p.spin) * 0.7 * k;      // 飘动的摆动感

      let a = 1;
      if(p.life > p.max * 0.62) a = 1 - (p.life - p.max * 0.62) / (p.max * 0.38);
      if(p.y > H + 60) a = 0;
      if(a <= 0) continue;
      alive++;
      drawRibbon(p, a);
    }

    if(!alive){                                // 放完就停，不留常驻动画
      raf = 0; parts = [];
      ctx.clearRect(0, 0, W, H);
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  return { burst: burst, resize: resize };
})();


/* ---------------------------------------------------------------------------
 * 音频管理器（统一管理 BGM，静默降级，静音状态跨页面保持）

const AudioManager = (function(){
  const el = new Audio();
  el.loop = true;

  el.volume = CONFIG.bgmVolume;
  el.setAttribute('playsinline', '');

  const MUTE_KEY = 'secret_base_muted';
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let currentSrc = null;
  let unlocked = false;

  const btn = document.getElementById('musicBtn');
  const icoOn = $('.ico-on', btn);

  function paint(){
    if(muted) btn.classList.add('muted'); else btn.classList.remove('muted');
    btn.title = muted ? '音乐已静音（点击开启）' : '音乐播放中（点击静音）';
    btn.setAttribute('aria-label', btn.title);
  }

  /* 播放指定音频；同一个文件重复调用不会重头播放 */
  function play(src){
    if(!src) return;
    if(currentSrc === src && !el.paused) return;
    currentSrc = src;
    try{
      el.src = src;
      el.muted = muted;
      const p = el.play();
      if(p && typeof p.catch === 'function'){
        // 静默降级：文件不存在 / 浏览器不允许自动播放，都不报错、不弹窗
        p.catch(function(){});
      }
    }catch(e){ /* 静默降级 */ }
  }

  function stop(){
    try{ el.pause(); }catch(e){}
  }

  function toggleMute(){
    muted = !muted;
    try{ localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); }catch(e){}
    el.muted = muted;
    if(!muted && currentSrc && el.paused){
      const p = el.play(); if(p && p.catch) p.catch(function(){});
    }
    paint();
  }

  /* 首次用户交互时解锁音频（为后续 BGM 自动播放做准备） */
  function unlock(){
    if(unlocked) return;
    unlocked = true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        if(!window.__abAudioCtx) window.__abAudioCtx = new AC();
        const c = window.__abAudioCtx;
        if(c.state === 'suspended' && c.resume) c.resume();
      }
    }catch(e){}
    // 用一段极短的静音尝试“激活”媒体元素（失败也无所谓）
    try{
      el.load();
      const p = el.play();
      if(p && p.catch) p.catch(function(){});
      el.pause();
    }catch(e){}
  }

  on(btn, 'click', function(e){ e.stopPropagation(); unlock(); toggleMute(); });

  // 任意首次交互都尝试解锁
  ['pointerdown','touchstart','keydown'].forEach(function(ev){
    window.addEventListener(ev, unlock, { passive:true });
  });
  // 解锁完成后再触发一次播放（等待音频上下文就绪）
  window.addEventListener('pointerup', function(){ unlock(); }, { passive:true });

  paint();

  return { play: play, stop: stop, toggleMute: toggleMute, unlock: unlock, isMuted: function(){ return muted; } };
})();

/* ---------------------------------------------------------------------------
 * 相册页的飘落层：花瓣 + 树叶
 * 只在「游戏相册」这一页运行时才动画，离开就停，不浪费性能。
 * -------------------------------------------------------------------------*/
const Petals = (function(){
  const canvas = document.getElementById('petalCanvas');
  if(!canvas || !canvas.getContext){
    return { start:function(){}, stop:function(){}, resize:function(){} };
  }
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, items = [], raf = 0, lastT = 0, running = false;

  const PINK  = ['#f9bcd6','#f7a8c8','#fcd3e3','#f59fc4','#ffe2ef','#f4b0d0'];
  const GREEN = ['#9ed493','#8ccb84','#b5e0a6','#7fbf6f','#a7d99a'];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    // 直接用视口尺寸：整块屏幕都是花瓣的世界
    W = Math.max(1, Math.round(window.innerWidth  || canvas.clientWidth  || 1));
    H = Math.max(1, Math.round(window.innerHeight || canvas.clientHeight || 1));
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function spawn(startY){
    const leaf = Math.random() < 0.32;
    const r = (leaf ? 5.2 : 4.6) + Math.random() * (leaf ? 4.2 : 4.6);
    return {
      x: Math.random() * W,
      y: (startY == null) ? (-30 - Math.random() * H * 0.5) : startY,
      r: r,
      vy: 0.020 + Math.random() * 0.048,          // px / ms，慢慢飘
      vr: (Math.random() - 0.5) * 0.0016,
      sway: 0.020 + Math.random() * 0.055,
      sp: 0.0004 + Math.random() * 0.0010,
      ph: Math.random() * 6.2832,
      rot: Math.random() * 6.2832,
      a: 0.34 + Math.random() * 0.32,   // 半透明：有氛围感，又不会挡住看照片
      leaf: leaf,
      c: leaf ? GREEN[(Math.random() * GREEN.length) | 0]
              : PINK [(Math.random() * PINK.length)  | 0]
    };
  }
  function build(){
    // 现在是全屏飘落，数量按屏幕面积走：手机 34 片左右，桌面 64 片左右
    const n = Math.round(Math.min(80, Math.max(30, (W * H) / 21000)));
    items = [];
    for(let i = 0; i < n; i++) items.push(spawn(Math.random() * H));
  }

  function drawOne(p){
    ctx.save();
    ctx.globalAlpha = p.a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if(p.leaf){
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-p.r, -p.r * 1.1, 0, -p.r * 2.2);
      ctx.quadraticCurveTo( p.r, -p.r * 1.1, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, -p.r * 1.9); ctx.stroke();
    }else{
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-p.r * 1.15, -p.r * 0.5, -p.r * 0.9, -p.r * 1.7, 0, -p.r * 2.1);
      ctx.bezierCurveTo( p.r * 0.9, -p.r * 1.7,  p.r * 1.15, -p.r * 0.5, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(0, -1.5); ctx.lineTo(0, -p.r * 1.5); ctx.stroke();
    }
    ctx.restore();
  }

  function frame(t){
    if(!running) return;
    if(!lastT) lastT = t;
    const dt = Math.min(48, t - lastT);
    lastT = t;
    ctx.clearRect(0, 0, W, H);
    for(let i = 0; i < items.length; i++){
      const p = items[i];
      p.y   += p.vy * dt;
      p.x   += Math.sin(t * p.sp + p.ph) * p.sway * dt;
      p.rot += p.vr * dt;
      if(p.y - 30 > H){ items[i] = spawn(null); continue; }
      if(p.x < -40) p.x = W + 30; else if(p.x > W + 40) p.x = -30;
      drawOne(p);
    }
    raf = requestAnimationFrame(frame);
  }

  function start(){
    resize();
    if(!items.length) build();
    if(running) return;
    running = true; lastT = 0;
    raf = requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    ctx.clearRect(0, 0, W, H);
  }

  window.addEventListener('resize', function(){
    if(!running) return;
    resize(); build();
  }, { passive:true });

  return { start: start, stop: stop, resize: resize };
})();

const Router = (function(){
  let current = 'page0';

  function show(id){
    if(id === current) return;
    const from = document.getElementById(current);
    const to = document.getElementById(id);
    if(!to) return;

    if(from) from.classList.remove('active');
    to.classList.add('active');
    to.scrollTop = 0;
    current = id;

    // 音乐开关：所有有音乐的页面都显示（含密码门）
    document.getElementById('musicBtn').classList.add('show');

    if(id === 'page4'){ Album.fit(); Petals.start(); }

    if(id === 'page5') TimeMachine.refresh();

    // BGM 切换

/* ---------------------------------------------------------------------------
 * 页面 0 · 密码门
 * -------------------------------------------------------------------------*/
(function initGate(){
  const input = document.getElementById('gateInput');
  const btn   = document.getElementById('gateBtn');
  const err   = document.getElementById('gateError');

  function submit(){
    // 已经离开密码门（例如连点两次、或按了回车又点按钮）就不再重复处理
    const gate = document.getElementById('page0');
    if(!gate || !gate.classList.contains('active')) return;

    const v = (input.value || '').trim();
    if(v === CONFIG.password){
      // 密码正确：隐藏错误提示，淡入进入下一页
      err.classList.remove('show');
      input.classList.remove('wrong');
      btn.disabled = true;
      input.blur();
      Router.show('page1');
      return;
    }
    // 密码错误：抖动 + 变红 + 显示「密码错误」
    input.classList.remove('wrong');
    void input.offsetWidth;              // 强制重排以重启动画
    input.classList.add('wrong');
    err.classList.add('show');           // 显示「密码错误」
    setTimeout(function(){ input.classList.remove('wrong'); }, 900);
    input.value = '';
    input.focus();
  }

  function clearErr(){
    err.classList.remove('show');
    input.classList.remove('wrong');
  }

  on(btn, 'click', function(e){ e.stopPropagation(); AudioManager.unlock(); submit(); });
  on(input, 'input', function(){ AudioManager.unlock(); if(input.value) clearErr(); });
  on(input, 'focus', function(){ AudioManager.unlock(); });
  on(input, 'keydown', function(e){
    AudioManager.unlock();
    if(e.key === 'Enter'){ e.preventDefault(); submit(); }
  });

  // 桌面端自动聚焦（移动端不弹键盘，避免遮挡）
  setTimeout(function(){
    let canHover = true;
    try{
      canHover = !(window.matchMedia && window.matchMedia('(hover: hover)').matches === false);
    }catch(e){ canHover = true; }
    if(canHover) input.focus();
  }, 600);
})();
